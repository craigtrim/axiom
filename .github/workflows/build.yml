name: Electron desktop
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # #165: qualify hidden rendering against unchanged native tests and a real bug.
  quiet-qualification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:quiet:qualify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-qualification
          path: |
            artifacts/quiet-qualification/**
            artifacts/quiet/results.json
            artifacts/test-results/**
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The shared component specimens use Playwright's Chromium (craigtrim/axiom#81).
      - run: npx playwright install chromium
      - run: npm run test:desktop
      - run: npm audit --audit-level=moderate
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-windows-x64
          path: |
            artifacts/installer/**
            artifacts/latest-electron.json
            artifacts/playwright-report/**
            artifacts/test-results/**
