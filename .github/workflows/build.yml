name: Electron desktop
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # #165: qualify hidden rendering against unchanged native tests and a real bug.
  quiet-qualification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure native test display
        shell: powershell
        run: .\scripts\setup-ci-display.ps1
      - run: npm run build
      - run: npm run test:quiet:qualify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-qualification
          path: |
            artifacts/quiet-qualification/**
            artifacts/quiet/results.json
            artifacts/test-results/**
  windows:
    runs-on: windows-latest
    env:
      AXIOM_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/artifacts/ci-model
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # #165: native tests must use real dependencies instead of silently skipping.
      - name: Install verified Mutatoc runtime
        shell: powershell
        run: .\scripts\setup-ci-mutatoc.ps1
      - uses: actions/cache@v4
        with:
          path: ${{ env.AXIOM_EMBEDDING_MODEL_DIR }}
          key: mpnet-fp32-${{ runner.os }}-${{ hashFiles('src/shared/embeddings.ts') }}
      - run: npm run setup:embeddings
      - name: Configure native test display
        shell: powershell
        run: .\scripts\setup-ci-display.ps1
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The shared component specimens use Playwright's Chromium (craigtrim/axiom#81).
      - run: npx playwright install chromium
      # #165: report the graph creation regressions before the long visual inventory.
      - run: npm run test:desktop -- tests/e2e/authoring.spec.ts tests/e2e/entity-context-menu.spec.ts tests/e2e/extend-audit.spec.ts
        if: matrix.shard == 1
      - run: npm run test:desktop -- tests/e2e/individuals-visual.spec.ts tests/e2e/inspector-visual.spec.ts --grep "Individuals (supplementary )?reference light|light-01-class-expanded" --max-failures=5
        if: matrix.shard == 2
      - run: npm run test:desktop -- tests/e2e/ontology-quality.spec.ts tests/e2e/query-results.spec.ts tests/e2e/query-visual.spec.ts --grep "successive corrections|closing and reopening|06-running|14-cancelled" --max-failures=5
        if: matrix.shard == 3
      - run: npm run test:desktop -- tests/e2e/utility-visual.spec.ts --grep "frame 07 " --max-failures=1
        if: matrix.shard == 4
      # Every normal test remains selected; files keep their serial execution.
      - run: npm run test:desktop -- --shard=${{ matrix.shard }}/4
      - run: npm audit --audit-level=moderate
      - run: npm run package
        if: matrix.shard == 1
        env:
          AXIOM_LOCAL_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-windows-x64-${{ matrix.shard }}
          retention-days: 7
          path: |
            artifacts/installer/**
            artifacts/latest-electron.json
            artifacts/playwright-report/**
            artifacts/test-results/**
