name: Electron desktop
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # #165: qualify hidden rendering against unchanged native tests and a real bug.
  quiet-qualification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure native test display
        shell: powershell
        run: .\scripts\setup-ci-display.ps1
      - run: npm run build
      - run: npm run test:quiet:qualify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-qualification
          path: |
            artifacts/quiet-qualification/**
            artifacts/quiet/results.json
            artifacts/test-results/**
  windows:
    runs-on: windows-latest
    env:
      AXIOM_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/artifacts/ci-model
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # #165: native tests must use real dependencies instead of silently skipping.
      - name: Install verified Mutatoc runtime
        shell: powershell
        run: .\scripts\setup-ci-mutatoc.ps1
      - uses: actions/cache@v4
        with:
          path: ${{ env.AXIOM_EMBEDDING_MODEL_DIR }}
          key: mpnet-fp32-${{ runner.os }}-${{ hashFiles('src/shared/embeddings.ts') }}
      - run: npm run setup:embeddings
      - name: Configure native test display
        shell: powershell
        run: .\scripts\setup-ci-display.ps1
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The shared component specimens use Playwright's Chromium (craigtrim/axiom#81).
      - run: npx playwright install chromium
      # #165: temporary migration evidence; remove after committing reviewed HTML-derived captures.
      - name: Generate independent Find reference captures
        if: matrix.shard == 1
        continue-on-error: true
        run: node node_modules/@playwright/test/cli.js test --config=config/playwright.config.ts tests/e2e/extend-visual.spec.ts --grep "#56"
        env:
          AXIOM_UPDATE_REFERENCE: "1"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard == 1
        with:
          name: migrated-find-reference
          path: |
            tests/fixtures/extend-visual/v3-*.json
            artifacts/playwright-report/**
      - name: Verify migrated native coverage
        continue-on-error: true
        shell: pwsh
        run: |
          $cases = @{
            1 = @('tests/e2e/add-entity-groups.spec.ts', 'tests/e2e/add-entity-visual.spec.ts', 'tests/e2e/extend-audit.spec.ts', 'tests/e2e/find-stability.spec.ts')
            2 = @('tests/e2e/individuals-visual.spec.ts', 'tests/e2e/inspector-visual.spec.ts')
            3 = @('tests/e2e/statement-groups.spec.ts', 'tests/e2e/seealso-warnings.spec.ts', 'tests/e2e/source-files.spec.ts', 'tests/e2e/sparsity-visual.spec.ts')
            4 = @('tests/e2e/utility-visual.spec.ts')
          }
          $files = $cases[${{ matrix.shard }}]
          node node_modules/@playwright/test/cli.js test --config=config/playwright.config.ts @files
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migrated-native-${{ matrix.shard }}
          path: |
            artifacts/playwright-report/**
            artifacts/test-results/**
      # #165: execute the full inventory even after a failure, so reports account
      # for every case. Files retain their serial execution within each shard.
      - run: node node_modules/@playwright/test/cli.js test --config=config/playwright.config.ts --shard=${{ matrix.shard }}/4
      - run: npm audit --audit-level=moderate
      - run: npm run package
        if: matrix.shard == 1
        env:
          AXIOM_LOCAL_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-windows-x64-${{ matrix.shard }}
          retention-days: 7
          path: |
            artifacts/installer/**
            artifacts/latest-electron.json
            artifacts/playwright-report/**
            artifacts/test-results/**
