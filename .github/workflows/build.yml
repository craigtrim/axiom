name: Electron desktop
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # #165: qualify hidden rendering against unchanged native tests and a real bug.
  quiet-qualification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure native test display
        shell: powershell
        run: .\scripts\setup-ci-display.ps1
      - run: npm run build
      - run: npm run test:quiet:qualify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-qualification
          path: |
            artifacts/quiet-qualification/**
            artifacts/quiet/results.json
            artifacts/test-results/**
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure native test display
        shell: powershell
        run: .\scripts\setup-ci-display.ps1
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The shared component specimens use Playwright's Chromium (craigtrim/axiom#81).
      - run: npx playwright install chromium
      # Every normal test remains selected; files keep their serial execution.
      - run: npm run test:desktop -- --shard=${{ matrix.shard }}/4 --max-failures=1
      - run: npm audit --audit-level=moderate
      - run: npm run package
        if: matrix.shard == 1
        env:
          AXIOM_LOCAL_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-windows-x64-${{ matrix.shard }}
          path: |
            artifacts/installer/**
            artifacts/latest-electron.json
            artifacts/playwright-report/**
            artifacts/test-results/**
