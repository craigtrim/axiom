<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiom: Individuals and Inspector</title>
<style>
/* ============================================================================
   INDIVIDUALS GRID, INSPECTOR, AND THE DETACHED TOUCHPOINTS ACTION

   Three changes, all driven by one ontology: schools.ttl, 21,461 individuals
   across a single populated class.

   1. THE GRID. It showed three columns, and two of them carried no
      information. Class was School on every one of 21,461 rows because the
      ontology has one populated class. IRI was the namespace prefix plus the
      QID, which is already :hasQID. One informative column out of three, while
      eleven predicates of real data stayed invisible.

      Columns are now derived from the data and chosen by the user. The
      chooser reports two numbers per column, because they answer two
      different questions: FILL is how many rows carry a value, DISTINCT is how
      many different values they carry. A column with one distinct value sorts
      nothing and filters nothing. A column whose distinct count equals its
      filled row count is an identifier, not a facet. Neither fact is visible
      from a column name.

   2. THE INSPECTOR. It was a class shaped form applied to an individual. Its
      Usage block reported Subclasses 0, Descendants 0, Direct instances 0:
      three facts that are structurally zero for any individual and can never
      be anything else. Nine of twelve statements sat behind a More properties
      twisty. Then it reported a statement count and offered a button to go
      read the statements somewhere else. Add and Remove sat against the far
      right edge, a long way from the Types control they operate on.

      It now renders only what can be non trivial for the subject's kind, puts
      the statements in the pane rather than a count of them, and keeps every
      control beside the thing it acts on.

   3. TOUCHPOINTS. It was a sub tab inside the Inspector and also a top level
      tab called Find Touchpoints_2, so one feature appeared twice and the
      second copy carried a disambiguating suffix. It is now one action,
      invoked against a named subject, opening its own pane titled by that
      subject. Two subjects give two panes with two names, never a _2.

   Tokens, type scale, spacing rhythm and icons are carried unchanged from
   index.html, find.html, quality.html and details.html. Nothing in this file
   is a new visual direction.
   ========================================================================= */

/* OD-LAYOUT-PRIMITIVES v1 2 structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line, never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only; authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  /* screen skeleton: bars take their own space, the middle scrolls */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

*, *::before, *::after { box-sizing: border-box; }

/* Tokens carried unchanged from details.html. No additions. */
:root {
  color-scheme: light;

  --ground:        #ffffff;
  --surface:       #f6f7f9;
  --raised:        #ffffff;
  --sunken:        #f0f2f5;

  --border:        #e1e4e8;
  --border-strong: #d0d7de;

  --text:          #1b1f24;
  --text-muted:    #57606a;

  --accent:        #0b5fd0;
  --accent-hover:  #0a52b4;
  --accent-fg:     #ffffff;
  --accent-soft:   #eaf2fd;
  --accent-tint:   #f4f8fe;

  --ok:            #0a7a3d;
  --ok-bg:         #e8f5ed;
  --ok-border:     #a9d8bd;

  --warn:          #8a6116;
  --warn-bg:       #fdf5e3;
  --warn-border:   #e6cf95;

  --bad:           #a4201a;
  --bad-bg:        #fdecea;
  --bad-border:    #e4a9a4;

  --idle:          #57606a;
  --idle-border:   #c6cbd1;

  --row-hover:     #f6f7f9;
  --row-selected:  #eaf2fd;

  --focus:         #0b5fd0;
  --shadow-pop:    0 8px 24px rgba(27, 31, 36, .18);

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;

  --r-ctl: 4px;
  --r-panel: 6px;
  --r-card: 8px;
  --r-pill: 999px;

  --t-fast: 120ms;
  --t-enter: 180ms;

  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;

  /* Pane split, driven by the two splitters. */
  --rail-w: 214px;
  --top-h: 46%;
}

/* Dark is measured against #0d1117. It is not an inversion of light. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0d1117; --surface: #161b22; --raised: #1c2128; --sunken: #10151c;
  --border: #30363d; --border-strong: #3d444d;
  --text: #e6edf3; --text-muted: #9ba7b4;
  --accent: #4c9aff; --accent-hover: #6aabff; --accent-fg: #06192e;
  --accent-soft: #12243a; --accent-tint: #0f1a28;
  --ok: #4ade80; --ok-bg: #0f2a1b; --ok-border: #1d5233;
  --warn: #e3b341; --warn-bg: #2b2211; --warn-border: #5a4718;
  --bad: #ff8d81; --bad-bg: #3a1a17; --bad-border: #7a3630;
  --idle: #9ba7b4; --idle-border: #454c54;
  --row-hover: #161b22; --row-selected: #12243a;
  --focus: #6aabff; --shadow-pop: 0 8px 24px rgba(0, 0, 0, .55);
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    color-scheme: dark;
    --ground: #0d1117; --surface: #161b22; --raised: #1c2128; --sunken: #10151c;
    --border: #30363d; --border-strong: #3d444d;
    --text: #e6edf3; --text-muted: #9ba7b4;
    --accent: #4c9aff; --accent-hover: #6aabff; --accent-fg: #06192e;
    --accent-soft: #12243a; --accent-tint: #0f1a28;
    --ok: #4ade80; --ok-bg: #0f2a1b; --ok-border: #1d5233;
    --warn: #e3b341; --warn-bg: #2b2211; --warn-border: #5a4718;
    --bad: #ff8d81; --bad-bg: #3a1a17; --bad-border: #7a3630;
    --idle: #9ba7b4; --idle-border: #454c54;
    --row-hover: #161b22; --row-selected: #12243a;
    --focus: #6aabff; --shadow-pop: 0 8px 24px rgba(0, 0, 0, .55);
  }
}

html, body { height: 100%; }
body {
  margin: 0; font: 14px/1.5 var(--font);
  background: var(--surface); color: var(--text);
  display: flex; flex-direction: column; overflow: hidden;
}
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg { width: 15px; height: 15px; flex: none; }

/* ------------------------------------------------------------ app chrome */
.appbar {
  display: flex; align-items: center; gap: var(--sp-2); flex: none;
  min-height: 32px; padding: 0 var(--sp-2);
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.appbar .ds { font-size: 12.5px; color: var(--text-muted); min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.appbar .ds b { color: var(--text); font-weight: 600; }

.mb {
  display: inline-flex; align-items: center; gap: 4px; flex: none;
  min-height: 24px; padding: 0 var(--sp-2); font: inherit; font-size: 13px;
  color: var(--text); background: none; border: 1px solid transparent;
  border-radius: var(--r-ctl); cursor: pointer;
}
.mb:hover, .mb[aria-expanded="true"] { background: var(--row-hover); border-color: var(--border); }

.ib {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 26px; height: 26px; border: 1px solid transparent; border-radius: var(--r-ctl);
  background: none; color: var(--text-muted); cursor: pointer;
}
.ib:hover { background: var(--row-hover); color: var(--text); }
.ib[aria-expanded="true"] { background: var(--row-hover); color: var(--text); border-color: var(--border); }

.btn {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  min-height: 26px; padding: 0 9px; font: inherit; font-size: 12.5px;
  color: var(--text); background: var(--raised);
  border: 1px solid var(--border-strong); border-radius: var(--r-ctl); cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--row-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent);
  color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.quiet { background: none; border-color: transparent; color: var(--text-muted); }
.btn.quiet:hover { background: var(--row-hover); color: var(--text); }
.btn.tiny { min-height: 22px; padding: 0 6px; font-size: 12px; }

.sel {
  min-height: 26px; padding: 0 var(--sp-1); font: inherit; font-size: 12.5px;
  color: var(--text); background: var(--raised);
  border: 1px solid var(--border-strong); border-radius: var(--r-ctl); cursor: pointer;
}

:is(.ib, .btn, .sel, .mb, .tab, .fld, .val, .rz, .hlab, .lnk, input, a):focus-visible {
  outline: 2px solid var(--focus); outline-offset: 1px; border-radius: var(--r-ctl);
}

.lnk { background: none; border: 0; padding: 0; font: inherit; color: var(--accent);
  cursor: pointer; text-align: start; }
.lnk:hover { text-decoration: underline; }

/* --------------------------------------------------------------- menus */
.menu {
  position: absolute; z-index: 60; min-width: 232px; padding: var(--sp-1);
  background: var(--raised); border: 1px solid var(--border-strong);
  border-radius: var(--r-panel); box-shadow: var(--shadow-pop);
}
.mi {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%;
  min-height: 28px; padding: 0 var(--sp-2); font: inherit; font-size: 13px;
  color: var(--text); background: none; border: 0; border-radius: var(--r-ctl);
  cursor: pointer; text-align: start;
}
.mi:hover:not(:disabled) { background: var(--row-hover); }
.mi:disabled { color: var(--text-muted); opacity: .6; cursor: default; }
.mi .sh { margin-left: auto; font-size: 11.5px; color: var(--text-muted); }
.msep { height: 1px; margin: var(--sp-1) 0; background: var(--border); }
.mnote { padding: var(--sp-1) var(--sp-2) var(--sp-2); font-size: 11.5px;
  color: var(--text-muted); }

/* -------------------------------------------------------- workbench grid */
.wb { flex: 1 1 auto; min-height: 0; display: grid;
  grid-template-rows: var(--top-h) 6px minmax(0, 1fr); padding: var(--sp-2); gap: 0; }
.wtop { min-height: 0; display: grid;
  grid-template-columns: var(--rail-w) 6px minmax(0, 1fr); }

.spl { background: none; border: 0; padding: 0; }
.spl.h { cursor: row-resize; }
.spl.v { cursor: col-resize; }
.spl::after { content: ""; display: block; background: var(--border);
  border-radius: var(--r-pill); }
.spl.h::after { width: 56px; height: 2px; margin: 2px auto; }
.spl.v::after { width: 2px; height: 56px; margin: auto 2px; }
.spl:hover::after, .spl:focus-visible::after { background: var(--accent); }

/* ------------------------------------------------------------- the pane */
.pane {
  container-type: size; container-name: pane;
  height: 100%; min-height: 0; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--ground); border: 1px solid var(--border);
  border-radius: var(--r-panel); overflow: hidden;
}
.ptabs {
  display: flex; align-items: stretch; flex: none; min-height: 32px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.ptabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 0 var(--sp-3); min-height: 32px; max-width: 260px;
  font: inherit; font-size: 12.5px; color: var(--text-muted);
  background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer;
}
.tab > .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600;
  background: var(--ground); border-bottom-color: var(--accent); }
.tab .x { display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: var(--r-ctl); color: var(--text-muted); }
.tab .x:hover { background: var(--border); color: var(--text); }
.ptabs .trail { margin-left: auto; display: flex; align-items: center;
  gap: 2px; padding-inline: var(--sp-1); flex: none; }

.phead {
  display: flex; align-items: center; gap: var(--sp-2); flex: none;
  min-height: 36px; padding: 0 var(--sp-2) 0 var(--sp-3);
  border-bottom: 1px solid var(--border);
}
.phead .name { font-weight: 600; font-size: 14px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbody { flex: 1 1 auto; min-height: 0; overflow: auto; }

/* The save status slot. Clean is one muted word; a draft brings its actions
   with it. This is the only place in the pane that reports save state. */
.state { display: flex; align-items: center; gap: var(--sp-2); margin-left: auto; flex: none; }
.state .word { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
.state.pending .word { color: var(--accent); font-weight: 600; }

/* ------------------------------------------------------- hierarchy rail */
.hcount { display: flex; align-items: center; gap: var(--sp-3); flex: none;
  min-height: 30px; padding: 0 var(--sp-3); font-size: 12.5px;
  color: var(--text-muted); border-bottom: 1px solid var(--border); }
.hcount b { color: var(--text); font-weight: 600; }
.hrow {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%;
  min-height: 28px; padding: 0 var(--sp-3); font: inherit; font-size: 13px;
  color: var(--text); background: none; border: 0; cursor: pointer; text-align: start;
}
.hrow:hover { background: var(--row-hover); }
.hrow[aria-pressed="true"] { background: var(--row-selected); font-weight: 600; }
.hrow .n { margin-left: auto; font-size: 12px; color: var(--text-muted);
  font-variant-numeric: tabular-nums; }
.hrow .sq { width: 11px; height: 11px; flex: none; border: 1.5px solid var(--idle-border); }
.hrow[aria-pressed="true"] .sq { border-color: var(--accent); background: var(--accent); }

/* ------------------------------------------------------------- inspector */
/* One identity line. Kind, class, local name and IRI, each once. */
.ident {
  display: flex; align-items: center; gap: var(--sp-2); flex: none;
  min-height: 26px; padding: var(--sp-1) var(--sp-3);
  font-size: 12px; color: var(--text-muted);
  border-bottom: 1px solid var(--border); background: var(--sunken);
}
.ident .kind { font-weight: 600; color: var(--text); flex: none; }
.ident .qid { font-family: var(--mono); color: var(--text); flex: none; }
.ident .iri { font-family: var(--mono); min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.dot { flex: none; color: var(--border-strong); }

.scount { display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3) var(--sp-1); font-size: 12.5px; color: var(--text-muted); }

table.st { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.st th {
  padding: 4px var(--sp-3); text-align: start; font-size: 11px;
  text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted);
  font-weight: 600; border-bottom: 1px solid var(--border);
}
table.st td { padding: 3px var(--sp-3); border-bottom: 1px solid var(--border);
  vertical-align: top; }
table.st tr:last-child td { border-bottom: 0; }
.c-pred { width: 158px; }

.pred { display: flex; align-items: center; gap: 4px; min-height: 28px;
  font-family: var(--mono); font-size: 12.5px; color: var(--text); }
.pred .inf { font-family: var(--font); font-size: 10.5px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; color: var(--warn);
  border: 1px solid var(--warn-border); background: var(--warn-bg);
  border-radius: var(--r-ctl); padding: 0 4px; }
.vals { display: grid; gap: 3px; max-width: 560px; }
.val {
  display: block; width: 100%; min-height: 28px; padding: 3px var(--sp-2);
  font: inherit; font-size: 13px; color: var(--text);
  background: var(--raised); border: 1px solid var(--border-strong);
  border-radius: var(--r-ctl);
}
.val:hover { border-color: var(--idle-border); }
.val[readonly] { background: var(--sunken); color: var(--text-muted); cursor: default; }
.vrow { display: flex; align-items: center; gap: var(--sp-1); }
.vrow .val { flex: 1 1 auto; min-width: 0; }

/* Usage. Rows that cannot be non trivial for this kind are not rendered at
   all. A measurable zero is shown as zero; an unmeasurable one is withdrawn. */
.usage { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3);
  padding: var(--sp-2) var(--sp-3); border-top: 1px solid var(--border);
  font-size: 12.5px; color: var(--text-muted); }
.usage .u { display: inline-flex; align-items: baseline; gap: 5px; }
.usage .u b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.empty { padding: var(--sp-6) var(--sp-3); text-align: center; color: var(--text-muted);
  font-size: 13px; }

/* ---------------------------------------------------------------- toolbar */
.tbar { display: flex; align-items: center; gap: var(--sp-2); flex: none;
  min-height: 36px; padding: var(--sp-1) var(--sp-2);
  border-bottom: 1px solid var(--border); }
.fwrap { position: relative; flex: 1 1 auto; min-width: 90px; max-width: 460px;
  display: flex; align-items: center; }
.fwrap .mag { position: absolute; inset-inline-start: 7px; color: var(--text-muted);
  pointer-events: none; display: flex; }
.fld {
  width: 100%; min-height: 28px; padding: 0 28px;
  font: inherit; font-size: 13px; color: var(--text);
  background: var(--raised); border: 1px solid var(--border-strong);
  border-radius: var(--r-ctl);
}
.fwrap .clr { position: absolute; inset-inline-end: 3px; width: 22px; height: 22px; }

/* --------------------------------------------------------------- the grid */
.gstat { display: flex; align-items: center; gap: var(--sp-2); flex: none;
  min-height: 24px; padding: 0 var(--sp-3); font-size: 12px; color: var(--text-muted);
  border-bottom: 1px solid var(--border); }
.gstat b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

.gwrap { flex: 1 1 auto; min-height: 0; overflow: auto; }
table.g { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
table.g th, table.g td {
  padding: 0 var(--sp-2); height: 30px; text-align: start; font-weight: 400;
  border-bottom: 1px solid var(--border);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
table.g thead th {
  position: sticky; top: 0; z-index: 2;
  height: 28px; background: var(--surface);
  font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--text-muted); font-weight: 600;
  border-bottom: 1px solid var(--border-strong);
  padding: 0;
}
table.g th.pin, table.g td.pin {
  position: sticky; inset-inline-start: 0; background: var(--ground);
  border-inline-end: 1px solid var(--idle-border); z-index: 1;
}
table.g thead th.pin { z-index: 3; background: var(--surface); }
table.g tbody tr:hover td { background: var(--row-hover); }
table.g tbody tr:hover td.pin { background: var(--row-hover); }
table.g tbody tr[aria-selected="true"] td,
table.g tbody tr[aria-selected="true"] td.pin { background: var(--row-selected); }
table.g td.num { text-align: end; font-variant-numeric: tabular-nums; }
table.g td.mono { font-family: var(--mono); font-size: 12px; }
table.g td { font-size: 13px; }

/* The header is a button for sorting plus a separator for resizing. They are
   two controls because they are two actions, and the separator is wide enough
   to hit without hitting the sort. */
.hcell { display: flex; align-items: stretch; height: 28px; position: relative; }
.hlab {
  display: flex; align-items: center; gap: 4px; flex: 1 1 auto; min-width: 0;
  padding: 0 var(--sp-2); font: inherit; font-size: 11px;
  text-transform: uppercase; letter-spacing: .04em; font-weight: 600;
  color: var(--text-muted); background: none; border: 0; cursor: pointer; text-align: start;
}
.hlab:hover { color: var(--text); background: var(--row-hover); }
.hlab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hlab .sg { flex: none; width: 11px; height: 11px; opacity: 0; }
.hlab[data-dir] .sg { opacity: 1; }
.hlab[data-dir] { color: var(--text); }
.rz {
  flex: none; width: 9px; margin-inline-end: -4px;
  padding: 0; background: none; border: 0; cursor: col-resize;
  position: relative; z-index: 5;
}
.rz::after { content: ""; position: absolute; inset-block: 5px; inset-inline-start: 4px;
  width: 1px; background: var(--border-strong); }
.rz:hover::after, .rz:focus-visible::after, .rz.live::after {
  inset-block: 0; width: 2px; background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
body.dragging { cursor: grabbing; user-select: none; }
.hlab.dragsrc { opacity: .45; }
.hcell.dropL::before, .hcell.dropR::before {
  content: ""; position: absolute; inset-block: 0; width: 2px;
  background: var(--accent); z-index: 6;
}
.hcell.dropL::before { inset-inline-start: 0; }
.hcell.dropR::before { inset-inline-end: 0; }

/* A cell is a value, never a label for the absence of one. An empty cell is
   empty: no dash, no zero, no placeholder word. */
.idc { display: flex; align-items: center; gap: 6px; min-width: 0; }
.idc .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idc .nm.anon { font-family: var(--mono); font-size: 12px; }
.tagid {
  flex: none; font-size: 10px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-muted);
  border: 1px solid var(--border-strong); border-radius: var(--r-ctl); padding: 0 3px;
}
.plus {
  flex: none; min-height: 18px; padding: 0 5px; font: inherit; font-size: 11px;
  font-variant-numeric: tabular-nums; color: var(--text-muted);
  background: var(--sunken); border: 1px solid var(--border-strong);
  border-radius: var(--r-pill); cursor: pointer;
}
.plus:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.cellwrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
.cellwrap .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.gfoot { display: flex; align-items: center; gap: var(--sp-2); flex: none;
  min-height: 30px; padding: 0 var(--sp-2) 0 var(--sp-3);
  border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
.gfoot .pg { margin-left: auto; display: flex; align-items: center; gap: var(--sp-1); }
.pgn { width: 46px; min-height: 22px; padding: 0 var(--sp-1); text-align: center;
  font: inherit; font-size: 12px; color: var(--text); background: var(--raised);
  border: 1px solid var(--border-strong); border-radius: var(--r-ctl);
  font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------- column chooser */
.pop {
  position: absolute; z-index: 60; width: 408px; max-width: calc(100vw - 16px);
  background: var(--raised); border: 1px solid var(--border-strong);
  border-radius: var(--r-panel); box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column; max-height: 520px;
}
.pop > .ph { display: flex; align-items: center; gap: var(--sp-2); flex: none;
  padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3);
  border-bottom: 1px solid var(--border); }
.pop > .ph .t { font-weight: 600; font-size: 13px; }
.pop > .pb { flex: 1 1 auto; min-height: 0; overflow: auto; padding: var(--sp-1) 0; }
.pop > .pf { flex: none; display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3); border-top: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-muted); }

.crow { display: flex; align-items: center; gap: var(--sp-2);
  min-height: 30px; padding: 0 var(--sp-2) 0 var(--sp-3); }
.crow:hover { background: var(--row-hover); }
.crow > label { display: flex; align-items: center; gap: var(--sp-2);
  flex: 1 1 auto; min-width: 0; cursor: pointer; }
.crow .cn { font-family: var(--mono); font-size: 12px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .cn.plain { font-family: var(--font); font-size: 13px; }
.crow input[type="checkbox"] { flex: none; width: 14px; height: 14px;
  accent-color: var(--accent); margin: 0; }
.crow.locked > label { cursor: default; }

/* Fill is how many rows carry a value. Distinct is how many different values
   they carry. The bar is paired with its number, never standing alone. */
.fillbar { flex: none; width: 36px; height: 5px; border-radius: var(--r-pill);
  background: var(--sunken); overflow: hidden; }
.fillbar > i { display: block; height: 100%; background: var(--text-muted); }
.crow .nums { flex: none; display: flex; align-items: baseline; gap: var(--sp-2);
  font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.crow .nums .f { width: 34px; text-align: end; }
.crow .nums .d { width: 42px; text-align: end; }
.why { flex: none; font-size: 10.5px; color: var(--text-muted);
  border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 0 4px;
  background: var(--sunken); white-space: nowrap; }
.why.warnish { color: var(--warn); border-color: var(--warn-border); background: var(--warn-bg); }
.ord { display: flex; gap: 1px; flex: none; }
.ord .ib { width: 20px; height: 20px; }

/* ----------------------------------------------------------- touchpoints */
.tpbar { display: flex; align-items: center; gap: var(--sp-2); flex: none;
  min-height: 28px; padding: 0 var(--sp-3); font-size: 12px; color: var(--text-muted);
  background: var(--sunken); border-bottom: 1px solid var(--border); }
.tpbar .pin { display: inline-flex; align-items: center; gap: 4px; flex: none;
  color: var(--text); font-weight: 600; }
.tprow { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto;
  align-items: center; gap: var(--sp-3); min-height: 32px; padding: 0 var(--sp-3);
  border-bottom: 1px solid var(--border); font-size: 13px; }
.tprow:hover { background: var(--row-hover); }
.tprow .p { font-family: var(--mono); font-size: 12px; color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tprow .e { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tprow .v { font-size: 11.5px; color: var(--text-muted); font-family: var(--mono); }
.tpgh { padding: var(--sp-2) var(--sp-3) var(--sp-1); font-size: 11px;
  font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-muted); background: var(--surface);
  border-bottom: 1px solid var(--border); }

/* ------------------------------------------------------------ value list */
.vpop { position: absolute; z-index: 70; max-width: 420px; min-width: 200px;
  padding: var(--sp-2); background: var(--raised);
  border: 1px solid var(--border-strong); border-radius: var(--r-panel);
  box-shadow: var(--shadow-pop); max-height: 320px; overflow: auto; }
.vpop .vh2 { font-size: 11px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-muted); padding: 0 var(--sp-1) var(--sp-1); }
.vpop ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.vpop li { padding: 3px var(--sp-1); font-size: 13px; border-radius: var(--r-ctl); }
.vpop li:nth-child(odd) { background: var(--sunken); }

/* ======================================================================== */
/* PRESENTATION. Container queries against each pane's own rectangle, at the
   published thresholds of 600 and 400 with 616 and 416 exits, plus the
   recovery state below 240 wide or 120 tall. No viewport media query sizes
   anything here, because a docked pane is not the window.                   */
/* ======================================================================== */

@container pane (max-height: 399px) {
  /* Shallow. The grid keeps its filter and its pager, because both are how you
     move through it. The status line goes: the pager already reports position,
     and rdf:type is still a statement row in the Inspector. */
  .gstat { display: none; }
  .usage { display: none; }
  .scount { padding-top: var(--sp-1); }
}
@container pane (max-width: 599px) {
  /* Narrow. Controls that state their own scope fold to icons; the chooser and
     the filter stay, because they are the two things this pane is for. */
  .tbar .wide { display: none; }
  .fwrap { max-width: none; }
  .c-pred { width: 118px; }
  .vals { max-width: none; }
  .tprow { grid-template-columns: 110px minmax(0, 1fr); }
  .tprow .v { display: none; }
  .ident .iri { display: none; }
}
@container pane (max-width: 239px), pane (max-height: 119px) {
  /* Recovery. The pane states what it is and nothing else. */
  .pbody, .gwrap, .tbar, .gfoot, .gstat, .ident, .usage, .tpbar { display: none; }
  .phead { border-bottom: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}
/* Hover reveal is for fine pointers only. A coarse pointer has no hover, so
   the control stands. */
.revealer .reveal { opacity: 1; }
@media (hover: hover) and (pointer: fine) {
  .revealer .reveal { opacity: 0; }
  .revealer:hover .reveal, .revealer:focus-within .reveal { opacity: 1; }
}

[hidden] { display: none !important; }
</style>

<!-- Application chrome. Only the two menus that carry a real action are here.
     Find touchpoints lives in Tools, which is where an action that produces
     its own result pane belongs. -->
<div class="appbar">
  <button type="button" class="mb" id="mTools" aria-haspopup="menu" aria-expanded="false">Tools</button>
  <button type="button" class="mb" id="mView" aria-haspopup="menu" aria-expanded="false">View</button>
  <span class="ds" id="dsline"></span>
  <span class="od-fill"></span>
  <button type="button" class="ib" id="themeBtn" title="Theme" aria-label="Theme: follow system"></button>
</div>

<div class="wb">
  <div class="wtop">

    <!-- Hierarchy. Not part of this change; present so the grid and the
         inspector have the context they are filtered by. -->
    <section class="pane" id="hierPane" aria-label="Hierarchy">
      <div class="phead"><span class="name">Hierarchy</span></div>
      <div class="hcount">
        <span>Classes <b id="hcClasses">0</b></span>
        <span>Properties <b>0</b></span>
      </div>
      <div class="pbody" id="hierBody"></div>
    </section>

    <button type="button" class="spl v" id="splV" role="separator"
      aria-orientation="vertical" aria-label="Resize the hierarchy rail" tabindex="0"></button>

    <!-- The stack. The Inspector plus any touchpoint panes, each titled by the
         subject it was run against. -->
    <section class="pane" id="stackPane" aria-label="Inspector and results">
      <div class="ptabs" id="tabs" role="tablist" aria-label="Open views"></div>
      <div class="od-fill" id="stackBody" style="display:flex;flex-direction:column;min-height:0"></div>
    </section>
  </div>

  <button type="button" class="spl h" id="splH" role="separator"
    aria-orientation="horizontal" aria-label="Resize the individuals pane" tabindex="0"></button>

  <!-- The individuals pane. One band carries the pane identity and every
       control, rather than a tab strip, a toolbar and a count line stacked. -->
  <section class="pane" id="gridPane" aria-label="Individuals">
    <div class="tbar">
      <span class="name od-fixed" style="font-weight:600;font-size:13px">Individuals</span>
      <span class="fwrap">
        <span class="mag" id="magSlot"></span>
        <input type="search" class="fld" id="filter" placeholder="Filter individuals"
          aria-label="Filter individuals" autocomplete="off">
        <button type="button" class="ib clr" id="filterClr" aria-label="Clear the filter" hidden></button>
      </span>
      <button type="button" class="btn" id="colsBtn" aria-haspopup="dialog" aria-expanded="false">
        <span id="colsBtnLabel">Columns</span>
      </button>
      <label class="od-fixed wide" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)">
        Class
        <select class="sel" id="classSel" aria-label="Filter by class"></select>
      </label>
      <button type="button" class="btn wide" id="newBtn">New individual</button>
      <button type="button" class="ib" id="gridMore" aria-haspopup="menu" aria-expanded="false"
        aria-label="More individuals options"></button>
    </div>

    <div class="gstat" id="gstat"></div>

    <div class="gwrap" id="gwrap" tabindex="0" aria-label="Individuals table, scrollable">
      <table class="g" id="gtab">
        <colgroup id="gcols"></colgroup>
        <thead><tr id="ghead"></tr></thead>
        <tbody id="gbody"></tbody>
      </table>
      <div class="empty" id="gempty" hidden></div>
    </div>

    <div class="gfoot" id="gfoot">
      <span id="gfrange"></span>
      <span class="pg">
        <button type="button" class="ib" id="pgFirst" aria-label="First page"></button>
        <button type="button" class="ib" id="pgPrev" aria-label="Previous page"></button>
        <span style="display:flex;align-items:center;gap:6px">
          <label for="pgNum">Page</label>
          <input type="text" inputmode="numeric" class="pgn" id="pgNum" aria-label="Page number">
          <span id="pgOf"></span>
        </span>
        <button type="button" class="ib" id="pgNext" aria-label="Next page"></button>
        <button type="button" class="ib" id="pgLast" aria-label="Last page"></button>
      </span>
    </div>
  </section>
</div>

<div id="live" class="vh" role="status" aria-live="polite"></div>

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && OPEN) { e.stopPropagation(); closeLayer(true); }

function menu(items) {
  var n = document.createElement("div");
  n.className = "menu";
  n.setAttribute("role", "menu");
  var html = "";
  items.forEach(function (it) {
    if (it.sep) { html += '<div class="msep"></div>'; return; }
    if (it.note) { html += '<div class="mnote">' + esc(it.note) + "</div>"; return; }
    html += '<button type="button" class="mi" role="menuitem"' +
      (it.disabled ? " disabled" : "") + ' data-k="' + esc(it.k || "") + '">' +

      "<span>" + esc(it.label) + "</span>" +

/* ===========================================================================
   6. ROW SET: class scope, filter, sort, paging
   ======================================================================== */
function scoped() {
  if (S.cls === "all") return ROWS;
  return ROWS.filter(function (r) { return r.p["rdf:type"] && r.p["rdf:type"][0] === S.cls; });
}
/* The filter reads the columns that are shown. Turning a column on widens the
   search; the status line says so, so it is never a surprise. */
function matched() {
  var base = scoped();
  var q = S.q.trim().toLowerCase();
  if (!q) return base;
  var cols = shownCols();
  return base.filter(function (r) {
    for (var i = 0; i < cols.length; i++) {
      var vs = cellValues(r, cols[i]);
      for (var j = 0; j < vs.length; j++) {
        if (String(vs[j]).toLowerCase().indexOf(q) !== -1) return true;
      }
    }
    return r.id.toLowerCase().indexOf(q) !== -1;
  });
}
function sortVal(r, c) {
  var vs = cellValues(r, c);
  if (!vs.length) return null;
  if (c.kind === "num") { var n = parseFloat(vs[0]); return isNaN(n) ? null : n; }
  return String(vs[0]).toLowerCase();
}
/* Blanks sort last in both directions. With 9 percent of this extract missing
   a label, an ascending sort that leads with blanks hides the data. */
function sorted() {
  var c = BYKEY[S.sortKey] || BYKEY.subject;
  var out = matched().slice();
  out.sort(function (a, b) {
    var av = sortVal(a, c), bv = sortVal(b, c);
    if (av === null && bv === null) return a.id < b.id ? -1 : 1;
    if (av === null) return 1;
    if (bv === null) return -1;
    if (av < bv) return -1 * S.sortDir;
    if (av > bv) return 1 * S.sortDir;
    return a.id < b.id ? -1 : 1;
  });
  return out;
}
var VIEW = [];
function pages() { return Math.max(1, Math.ceil(VIEW.length / S.per)); }
function pageRows() {
  var start = (S.page - 1) * S.per;
  return VIEW.slice(start, start + S.per);
}

/* ===========================================================================
   7. THE GRID
   ======================================================================== */
function renderGrid() {
  VIEW = sorted();
  if (S.page > pages()) S.page = pages();

  var cols = shownCols(), L = layout();
  var gcols = $("gcols"), ghead = $("ghead"), gbody = $("gbody");

  var ch = "", hh = "", total = 0;
  cols.forEach(function (c, i) {
    var w = L.w[c.key] || c.w;
    total += w;
    ch += '<col style="width:' + w + 'px">';
    var dir = (S.sortKey === c.key) ? (S.sortDir === 1 ? "asc" : "desc") : "";
    hh += '<th scope="col" role="columnheader"' + (i === 0 ? ' class="pin"' : "") +
      (dir ? ' aria-sort="' + (dir === "asc" ? "ascending" : "descending") + '"' : "") + ">" +
      '<div class="hcell" data-col="' + esc(c.key) + '">' +
        '<button type="button" class="hlab" data-sort="' + esc(c.key) + '"' +
          (dir ? ' data-dir="' + dir + '"' : "") + ">" +
          '<span class="t">' + esc(c.label) + "</span>" +
          '<span class="sg">' + ic(dir === "desc" ? "down" : "up") + "</span>" +
        "</button>" +
        '<button type="button" class="rz" data-rz="' + esc(c.key) + '" role="separator" tabindex="0"' +
          ' aria-orientation="vertical" aria-valuemin="' + MINW + '" aria-valuemax="' + MAXW + '"' +
          ' aria-valuenow="' + w + '" aria-label="Width of ' + esc(c.label) + '"></button>' +
      "</div></th>";
  });
  gcols.innerHTML = ch;
  ghead.innerHTML = hh;
  $("gtab").style.width = total + "px";

  var rows = pageRows(), body = "";
  rows.forEach(function (r) {
    var isSel = S.selected === r.id;
    body += '<tr role="row" data-id="' + esc(r.id) + '" aria-selected="' + (isSel ? "true" : "false") +
      '" tabindex="' + (isSel ? "0" : "-1") + '">';
    cols.forEach(function (c, i) {
      body += '<td role="gridcell"' + tdClass(c, i) + ">" + cellHtml(r, c) + "</td>";
    });
    body += "</tr>";
  });
  gbody.innerHTML = body;

  var none = VIEW.length === 0;
  $("gempty").hidden = !none;
  $("gtab").hidden = none;
  if (none) {
    $("gempty").innerHTML = S.q
      ? "No individual matches " + esc(JSON.stringify(S.q)) + " in the " + cols.length +
        " shown column" + (cols.length === 1 ? "" : "s") + ". Show more columns to widen the search."
      : "This class holds no individuals.";
  }
  renderStatus();
  renderFooter();
}
function tdClass(c, i) {
  var cl = [];
  if (i === 0) cl.push("pin");
  if (c.kind === "num") cl.push("num");
  if (c.kind === "mono") cl.push("mono");
  return cl.length ? ' class="' + cl.join(" ") + '"' : "";
}
/* A cell is a value. An empty cell is empty: no dash, no zero, no word
   standing in for the absence of a fact. */
function cellHtml(r, c) {
  var vs = cellValues(r, c);
  if (!vs.length) return "";
  if (c.key === "subject") {
    var anon = !hasLabel(r);
    return '<span class="idc"><span class="nm' + (anon ? " anon" : "") + '">' + esc(vs[0]) + "</span>" +
      (anon ? '<span class="tagid" title="No rdfs:label is asserted. This is the identifier.">id</span>' : "") +
      "</span>";
  }
  var first = '<span class="tx">' + esc(vs[0]) + "</span>";
  if (vs.length === 1) return '<span class="cellwrap">' + first + "</span>";
  return '<span class="cellwrap">' + first +
    '<button type="button" class="plus" data-vals="' + esc(r.id) + '" data-vk="' + esc(c.key) + '"' +
    ' aria-label="' + (vs.length - 1) + ' more values of ' + esc(c.label) + '">+' + (vs.length - 1) + "</button></span>";
}

function renderStatus() {
  var cols = shownCols().length, tot = scoped().length;
  var scope = S.cls === "all" ? "" : esc(S.cls) + " ";
  var html;
  if (S.q.trim()) {
    html = "<b>" + nf(VIEW.length) + "</b> of " + nf(tot) + " " + scope +
      "individuals match across " + cols + " shown column" + (cols === 1 ? "" : "s");
  } else {
    html = "<b>" + nf(tot) + "</b> " + scope + "individuals" +
      '<span class="dot">·</span>' + cols + " of " + COLS.length + " columns shown";
  }

}
function renderFooter() {
  var p = pages(), foot = $("gfoot") || document.querySelector(".gfoot");
  var multi = p > 1;
  foot.hidden = !multi;
  if (!multi) return;
  var start = (S.page - 1) * S.per + 1;
  var end = Math.min(S.page * S.per, VIEW.length);
  $("gfrange").textContent = "Rows " + nf(start) + " to " + nf(end);
  $("pgNum").value = String(S.page);
  $("pgOf").textContent = "of " + nf(p);
  $("pgFirst").disabled = $("pgPrev").disabled = S.page <= 1;
  $("pgNext").disabled = $("pgLast").disabled = S.page >= p;

/* ===========================================================================
   8. RESIZE, AUTOFIT, REORDER
   ======================================================================== */
var MC = null;
function measure(text, mono) {
  if (!MC) MC = document.createElement("canvas").getContext("2d");
  var cs = getComputedStyle(document.body);
  MC.font = mono
    ? '12px ' + cs.getPropertyValue("--mono")
    : '13px ' + cs.getPropertyValue("--font");
  return MC.measureText(text).width;
}
function setWidth(key, w, announce) {
  var L = layout();
  w = Math.max(MINW, Math.min(MAXW, Math.round(w)));
  L.w[key] = w;
  var cols = shownCols();
  var i = cols.findIndex(function (c) { return c.key === key; });
  if (i < 0) return;
  var colEl = $("gcols").children[i];
  if (colEl) colEl.style.width = w + "px";
  var total = 0;
  cols.forEach(function (c) { total += L.w[c.key] || c.w; });
  $("gtab").style.width = total + "px";
  var handle = $("ghead").querySelector('[data-rz="' + CSS.escape(key) + '"]');
  if (handle) handle.setAttribute("aria-valuenow", String(w));
  saveLayouts();
  if (announce) say(BYKEY[key].label + " is " + w + " pixels wide");
}
function autofit(key) {
  var c = BYKEY[key], mono = c.kind === "mono";
  var max = measure(c.label.toUpperCase(), false) + 46;
  pageRows().forEach(function (r) {
    var vs = cellValues(r, c);
    if (!vs.length) return;
    var w = measure(String(vs[0]), mono) + 22;
    if (vs.length > 1) w += 36;
    if (c.key === "subject" && !hasLabel(r)) w += 28;
    if (w > max) max = w;
  });
  setWidth(key, Math.ceil(max), true);
}

var RZ = null;
function gridHeadEvents() {
  var head = $("ghead");

  head.addEventListener("pointerdown", function (e) {
    var h = e.target.closest(".rz");
    if (h) {
      RZ = { key: h.dataset.rz, x0: e.clientX, w0: layout().w[h.dataset.rz] || BYKEY[h.dataset.rz].w, el: h };
      h.setPointerCapture(e.pointerId);
      h.classList.add("live");
      document.body.classList.add("resizing");
      e.preventDefault();
      return;
    }
    var lab = e.target.closest(".hlab");
    if (lab) startDrag(lab, e);
  });
  head.addEventListener("pointermove", function (e) {
    if (RZ) { setWidth(RZ.key, RZ.w0 + (e.clientX - RZ.x0)); return; }
    if (DRAG) moveDrag(e);
  });
  head.addEventListener("pointerup", function (e) {
    if (RZ) {
      RZ.el.classList.remove("live");
      document.body.classList.remove("resizing");
      say(BYKEY[RZ.key].label + " is " + layout().w[RZ.key] + " pixels wide");
      RZ = null;
      return;
    }
    if (DRAG) endDrag(e);
  });
  head.addEventListener("pointercancel", function () {
    if (RZ) { RZ.el.classList.remove("live"); document.body.classList.remove("resizing"); RZ = null; }
    if (DRAG) cancelDrag();
  });

  head.addEventListener("dblclick", function (e) {
    var h = e.target.closest(".rz");
    if (h) { e.preventDefault(); autofit(h.dataset.rz); }
  });

  head.addEventListener("click", function (e) {
    var lab = e.target.closest(".hlab");
    if (!lab || DRAGGED) { DRAGGED = false; return; }
    var k = lab.dataset.sort;
    if (S.sortKey === k) S.sortDir = -S.sortDir;
    else { S.sortKey = k; S.sortDir = 1; }
    S.page = 1;
    renderGrid();
    say("Sorted by " + BYKEY[k].label + ", " + (S.sortDir === 1 ? "ascending" : "descending"));
  });

  /* Resizing from the keyboard, so a column is not mouse only. */
  head.addEventListener("keydown", function (e) {
    var h = e.target.closest(".rz");
    if (!h) return;
    var k = h.dataset.rz, w = layout().w[k] || BYKEY[k].w, step = e.shiftKey ? 32 : 8;
    if (e.key === "ArrowLeft") { setWidth(k, w - step, true); e.preventDefault(); }
    else if (e.key === "ArrowRight") { setWidth(k, w + step, true); e.preventDefault(); }
    else if (e.key === "Enter" || e.key === " ") { autofit(k); e.preventDefault(); }
    else if (e.key === "Home") { setWidth(k, BYKEY[k].w, true); e.preventDefault(); }
  });
}

var DRAG = null, DRAGGED = false;
function startDrag(lab, e) {
  DRAG = { key: lab.dataset.sort, x0: e.clientX, el: lab, armed: false, over: null, side: "L" };
  lab.setPointerCapture(e.pointerId);
}
function moveDrag(e) {
  if (!DRAG) return;
  if (!DRAG.armed) {
    if (Math.abs(e.clientX - DRAG.x0) < 5) return;
    DRAG.armed = true;
    DRAG.el.classList.add("dragsrc");
    document.body.classList.add("dragging");
  }
  var cells = $("ghead").querySelectorAll(".hcell");
  var hit = null;
  cells.forEach(function (cell) {
    cell.classList.remove("dropL", "dropR");
    var r = cell.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right) hit = { cell: cell, r: r };
  });
  if (!hit) { DRAG.over = null; return; }
  var side = (e.clientX < hit.r.left + hit.r.width / 2) ? "L" : "R";
  hit.cell.classList.add(side === "L" ? "dropL" : "dropR");
  DRAG.over = hit.cell.dataset.col;
  DRAG.side = side;
}
function endDrag() {
  if (!DRAG) { return; }
  var armed = DRAG.armed, from = DRAG.key, to = DRAG.over, side = DRAG.side;
  cancelDrag();
  if (!armed) return;
  DRAGGED = true;
  if (!to || to === from) return;
  moveColumn(from, to, side);
}
function cancelDrag() {
  if (!DRAG) return;
  DRAG.el.classList.remove("dragsrc");
  document.body.classList.remove("dragging");
  $("ghead").querySelectorAll(".hcell").forEach(function (c) { c.classList.remove("dropL", "dropR"); });
  DRAG = null;
}
function moveColumn(from, to, side) {
  var L = layout(), o = L.order.slice();
  o.splice(o.indexOf(from), 1);
  var at = o.indexOf(to);
  o.splice(side === "L" ? at : at + 1, 0, from);
  L.order = o;
  saveLayouts();
  renderGrid();
  say(BYKEY[from].label + " moved");
}
function nudgeColumn(key, dir) {
  var L = layout();
  var vis = shownCols().map(function (c) { return c.key; });
  var i = vis.indexOf(key);
  if (i < 0) {
    var o = L.order.slice(), j = o.indexOf(key), k = Math.max(0, Math.min(o.length - 1, j + dir));
    o.splice(j, 1); o.splice(k, 0, key); L.order = o;
  } else {
    var t = i + dir;
    if (t < 0 || t >= vis.length) return;
    var ord = L.order.slice();
    var a = ord.indexOf(key), b = ord.indexOf(vis[t]);
    ord.splice(a, 1);
    ord.splice(ord.indexOf(vis[t]) + (dir > 0 ? 1 : 0), 0, key);
    L.order = ord;
  }
  saveLayouts();
  renderGrid();
  renderChooser();
}

/* ===========================================================================
   9. THE COLUMN CHOOSER
   ======================================================================== */
function chooserNode() {
  var n = document.createElement("div");

    '<div class="ph">' +

    "</div>" +

/* ===========================================================================
   10. THE INSPECTOR
   ======================================================================== */
var PRED_ORDER = ["rdf:type", "rdfs:label", "rdfs:comment", "rdfs:seeAlso",
  ":establishedYear", ":hasCountry", ":locatedIn", ":hasCoordinates",
  ":hasWebsite", ":hasType", ":hasQID", ":hasLanguage", "owl:sameAs"];

function statementsOf(r) {
  var src = pOf(r), out = [];
  PRED_ORDER.forEach(function (p) {
    if (src[p] && src[p].length) out.push({ pred: p, values: src[p].slice() });
  });
  Object.keys(src).forEach(function (p) {
    if (PRED_ORDER.indexOf(p) === -1 && src[p].length) out.push({ pred: p, values: src[p].slice() });
  });
  return out;
}
/* Inferred, not asserted: an individual of School is also an owl:Thing because
   School is a subclass of owl:Thing. It is reported, never edited in place. */
function inferredOf() { return [{ pred: "rdf:type", values: ["owl:Thing"] }]; }

/* How many statements elsewhere in the store point at this subject. This is
   the usage fact an individual actually has. */
function referencedBy(r) {
  var qid = r.id, n = 0;
  for (var i = 0; i < ROWS.length; i++) {
    var o = ROWS[i];
    if (o.id === qid) continue;
    for (var k in o.p) {
      if (!Object.prototype.hasOwnProperty.call(o.p, k)) continue;
      var vs = o.p[k];
      for (var j = 0; j < vs.length; j++) { if (vs[j] === qid) { n++; break; } }
    }
  }
  return n;
}

function currentSubject() {
  if (!S.selected) return null;
  for (var i = 0; i < ROWS.length; i++) if (ROWS[i].id === S.selected) return ROWS[i];
  return null;
}

var EXPANDED = {};
function inspectorHtml() {
  var r = currentSubject();

    return '<div class="phead"><span class="name">Inspector</span></div>' +
      '<div class="pbody"><div class="empty">Select an individual to inspect it.</div></div>';
  }
  var st = statementsOf(r), inf = S.showInferred ? inferredOf() : [];
  var tp = pOf(r)["rdf:type"];
  var cls = (tp && tp[0]) ? tp[0] : "owl:Thing";

  var rows = "";
  st.forEach(function (s) {
    rows += stRow(s, false);
  });
  inf.forEach(function (s) { rows += stRow(s, true); });

  var state = S.drafts[r.id]
    ? '<span class="state pending"><span class="word">Draft</span>' +
        '<button type="button" class="btn" data-act="discard">Discard</button>' +
        '<button type="button" class="btn primary" data-act="apply">Apply changes</button></span>'
    : '<span class="state"><span class="word">Saved</span></span>';

  return (
    '<div class="phead">' +
      '<span class="name" id="insName">' + esc(draftLabel(r)) + "</span>" +
      state +
      '<button type="button" class="ib" id="insMore" aria-haspopup="menu" aria-expanded="false"' +
        ' aria-label="More actions for this entity">' + ic("dots") + "</button>" +
    "</div>" +

    /* One identity line. Kind, class, local name and IRI, each stated once. */
    '<div class="ident">' +
      '<span class="kind">Individual</span>' +
      '<span class="dot">·</span><button type="button" class="lnk" data-cls="' + esc(cls) + '">' + esc(cls) + "</button>" +
      '<span class="dot">·</span><span class="qid">:' + esc(r.id) + "</span>" +
      '<span class="dot">·</span><span class="iri">' + esc(NS + r.id) + "</span>" +
    "</div>" +

    '<div class="pbody">' +
      '<div class="scount">' +

      "<thead><tr><th>Predicate</th><th>Value</th></tr></thead><tbody>" + rows + "</tbody></table>" +

    /* Usage. Subclasses, Descendants and Direct instances are not rendered for

      '<span class="u">Referenced by <b>' + nf(referencedBy(r)) + "</b></span>" +

function stRow(s, isInferred) {
  var open = !!EXPANDED[s.pred], cap = 3;
  var vis = (open || s.values.length <= cap) ? s.values : s.values.slice(0, cap);
  var hidden = s.values.length - vis.length;

  vis.forEach(function (v, i) {

        : (open && s.values.length > cap

/* Draft handling. Typing does not write to the ontology. The draft and its two
   actions live in the one header slot that reports save state. */
function ensureDraft(r) {
  if (!S.drafts[r.id]) {
    S.drafts[r.id] = { id: r.id, p: JSON.parse(JSON.stringify(r.p)) };
  }
  return S.drafts[r.id];
}
function applyDraft() {
  var r = currentSubject();
  if (!r || !S.drafts[r.id]) return;
  r.p = S.drafts[r.id].p;
  delete S.drafts[r.id];
  REV++;
  computeStats(ROWS);
  renderGrid();
  renderStack();
  say("Changes applied. Revision " + REV + ".");
}
function discardDraft() {
  var r = currentSubject();
  if (r) delete S.drafts[r.id];
  renderStack();
  say("Draft discarded. The ontology was not changed.");
}

/* ===========================================================================
   11. TOUCHPOINTS, AS A DETACHED ACTION

   It was a sub tab inside the Inspector and also a top level tab called
   Find Touchpoints_2. It is now one action against one named subject, opening
   one pane titled by that subject, which is why no suffix is ever needed.
   The pane stays pinned to the subject it was run against; selecting another
   individual in the grid does not retarget it.
   ======================================================================== */
var TP_PREDS = [":hasCountry", ":locatedIn", ":hasType", ":establishedYear", ":hasLanguage"];
function computeTouchpoints(r) {
  var groups = [];
  TP_PREDS.forEach(function (p) {
    var mine = r.p[p];
    if (!mine || !mine.length) return;
    var v = mine[0], hits = [];
    for (var i = 0; i < ROWS.length && hits.length < 200; i++) {
      var o = ROWS[i];
      if (o.id === r.id) continue;
      var vs = o.p[p];
      if (vs && vs.indexOf(v) !== -1) hits.push(o);
    }
    if (hits.length) groups.push({ pred: p, value: v, hits: hits });
  });
  return groups;
}
function openTouchpoints(id) {
  var r = null;
  for (var i = 0; i < ROWS.length; i++) if (ROWS[i].id === id) r = ROWS[i];
  if (!r) return;
  var tid = "tp:" + id;
  var found = S.tabs.filter(function (t) { return t.id === tid; })[0];
  if (!found) {
    S.tabs.push({
      kind: "tp", id: tid, subject: id, title: shorten(labelOf(r), 26),
      rev: REV, groups: computeTouchpoints(r), show: {}
    });
  }
  S.active = tid;
  renderStack();
  say("Touchpoints opened for " + labelOf(r));
}
function rerunTouchpoints(tid) {
  var t = S.tabs.filter(function (x) { return x.id === tid; })[0];
  if (!t) return;
  var r = null;
  for (var i = 0; i < ROWS.length; i++) if (ROWS[i].id === t.subject) r = ROWS[i];
  if (!r) return;
  t.groups = computeTouchpoints(r);
  t.rev = REV;
  renderStack();
  say("Touchpoints rerun at revision " + REV);
}
function touchHtml(t) {
  var total = 0;
  t.groups.forEach(function (g) { total += g.hits.length; });
  var stale = t.rev !== REV;

  var list = "";
  t.groups.forEach(function (g) {
    var open = !!t.show[g.pred], cap = 5;
    var vis = open ? g.hits : g.hits.slice(0, cap);
    list += '<div class="tpgh">' + esc(g.pred) + ' <span style="font-family:var(--mono);text-transform:none">' +
      esc(g.value) + "</span> · " + nf(g.hits.length) + " entit" + (g.hits.length === 1 ? "y" : "ies") + "</div>";
    vis.forEach(function (o) {
      list += '<div class="tprow"><span class="p">' + esc(g.pred) + "</span>" +
        '<button type="button" class="lnk e" data-goto="' + esc(o.id) + '">' + esc(labelOf(o)) + "</button>" +
        '<span class="v">:' + esc(o.id) + "</span></div>";
    });
    if (g.hits.length > cap) {
      list += '<div class="tprow"><span class="p"></span>' +
        '<button type="button" class="btn tiny quiet" data-tpexp="' + esc(g.pred) + '">' +
        (open ? "Show fewer" : nf(g.hits.length - cap) + " more") + "</button><span></span></div>";
    }
  });

  return (
    '<div class="phead">' +
      '<span class="name">Touchpoints</span>' +
      '<span class="state"><span class="word">' + (stale ? "Out of date" : "Current") + "</span>" +
        '<button type="button" class="btn' + (stale ? " primary" : "") + '" data-rerun="' + esc(t.id) + '">Rerun</button>' +
      "</span>" +
    "</div>" +
    '<div class="tpbar">' +
      '<span class="pin">' + ic("pin") + esc(t.title) + "</span>" +
      '<span class="dot">·</span><span>:' + esc(t.subject) + "</span>" +
      '<span class="dot">·</span><span>run at revision ' + nf(t.rev) + "</span>" +
      '<span class="dot">·</span><span>pinned to this subject</span>' +
    "</div>" +
    '<div class="pbody">' +
      (total === 0
        ? '<div class="empty">Nothing in the loaded ontology shares a value with this subject.</div>'
        : '<div class="scount"><b>' + nf(total) + "</b> entities share a value with this subject across " +
          t.groups.length + " predicate" + (t.groups.length === 1 ? "" : "s") + "</div>" + list) +
    "</div>"
  );
}

function copy(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
      say("Copied " + text);
      return;
    }
  } catch (e) { /* fall through */ }
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); say("Copied " + text); }
  catch (e2) { say("Copy is unavailable here."); }
  document.body.removeChild(ta);
}
function startRename() {
  var r = currentSubject();
  if (!r) return;
  var host = $("insName");
  if (!host) return;
  var inp = document.createElement("input");
  inp.className = "fld";
  inp.style.maxWidth = "420px";
  inp.value = labelOf(r);
  inp.setAttribute("aria-label", "Rename this entity");
  host.replaceWith(inp);
  inp.focus();
  inp.select();
  function commit(save) {
    if (save) {
      var d = ensureDraft(r);
      d.p["rdfs:label"] = [inp.value];
    }
    renderStack();
  }
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); commit(true); }
    else if (e.key === "Escape") { e.preventDefault(); commit(false); }
  });
  inp.addEventListener("blur", function () { commit(true); });
}
function setPer(n) { S.per = n; S.page = 1; renderGrid(); }
function togglePane(id) {
  var el = $(id);
  el.hidden = !el.hidden;
  if (id === "hierPane") document.documentElement.style.setProperty("--rail-w", el.hidden ? "0px" : "214px");
  if (id === "gridPane") document.documentElement.style.setProperty("--top-h", el.hidden ? "100%" : "46%");
  if (id === "stackPane") document.documentElement.style.setProperty("--top-h", el.hidden ? "0%" : "46%");
}
function resetLayout() {
  document.documentElement.style.setProperty("--rail-w", "214px");
  document.documentElement.style.setProperty("--top-h", "46%");
  ["hierPane", "stackPane", "gridPane"].forEach(function (i) { $(i).hidden = false; });
  say("Layout reset");
}
function exportCsv() {
  var cols = shownCols();
  var lines = [cols.map(function (c) { return q(c.label); }).join(",")];
  VIEW.forEach(function (r) {
    lines.push(cols.map(function (c) { return q(cellValues(r, c).join(" | ")); }).join(","));
  });
  function q(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }
  var blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "individuals-" + cols.length + "-columns.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  say("Exported " + nf(VIEW.length) + " rows and " + cols.length + " columns");
}

/* Splitters. Each pane is measured by its own rectangle, so moving one of
   these is what moves a pane through the presentation ladder. */
function splitter(el, axis) {
  var drag = null;
  el.addEventListener("pointerdown", function (e) {
    var wb = $("gridPane").parentNode.getBoundingClientRect();
    drag = { x: e.clientX, y: e.clientY, box: wb };
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  el.addEventListener("pointermove", function (e) {
    if (!drag) return;
    if (axis === "v") {
      var w = Math.max(0, Math.min(620, e.clientX - drag.box.left - 8));
      document.documentElement.style.setProperty("--rail-w", w + "px");
    } else {
      var pctv = (e.clientY - drag.box.top) / drag.box.height * 100;
      pctv = Math.max(0, Math.min(100, pctv));
      document.documentElement.style.setProperty("--top-h", pctv.toFixed(1) + "%");
    }
  });
  el.addEventListener("pointerup", function () { drag = null; });
  el.addEventListener("pointercancel", function () { drag = null; });
  el.addEventListener("keydown", function (e) {
    var cs = getComputedStyle(document.documentElement);
    if (axis === "v") {
      var w = parseFloat(cs.getPropertyValue("--rail-w")) || 214;
      if (e.key === "ArrowLeft") { document.documentElement.style.setProperty("--rail-w", Math.max(0, w - 16) + "px"); e.preventDefault(); }
      if (e.key === "ArrowRight") { document.documentElement.style.setProperty("--rail-w", Math.min(620, w + 16) + "px"); e.preventDefault(); }
    } else {
      var h = parseFloat(cs.getPropertyValue("--top-h")) || 46;
      if (e.key === "ArrowUp") { document.documentElement.style.setProperty("--top-h", Math.max(0, h - 4) + "%"); e.preventDefault(); }
      if (e.key === "ArrowDown") { document.documentElement.style.setProperty("--top-h", Math.min(100, h + 4) + "%"); e.preventDefault(); }
    }
  });
}

function select(id, focusRow) {
  S.selected = id;
  $("gbody").querySelectorAll("tr").forEach(function (tr) {
    var on = tr.dataset.id === id;
    tr.setAttribute("aria-selected", on ? "true" : "false");
    tr.tabIndex = on ? 0 : -1;
    if (on && focusRow) tr.focus();
  });
  if (S.active === "inspector") renderStack();
  else renderTabs();
}
function moveSelection(delta) {
  var rows = pageRows();
  if (!rows.length) return;
  var i = rows.findIndex(function (r) { return r.id === S.selected; });
  var t = i < 0 ? 0 : i + delta;
  if (t < 0) {
    if (S.page > 1) { S.page--; renderGrid(); var p = pageRows(); select(p[p.length - 1].id, true); }
    return;
  }
  if (t >= rows.length) {
    if (S.page < pages()) { S.page++; renderGrid(); select(pageRows()[0].id, true); }
    return;
  }
  select(rows[t].id, true);
}

  $("pgNum").addEventListener("change", function () {
    var n = parseInt(this.value, 10);
    S.page = (isNaN(n) ? 1 : Math.max(1, Math.min(pages(), n)));
    renderGrid();
  });

  /* hierarchy */
  $("hierBody").addEventListener("click", function (e) {
    var b = e.target.closest("[data-cls]");
    if (b) setClass(b.dataset.cls);
  });

  /* tabs */
  $("tabs").addEventListener("click", function (e) {
    var x = e.target.closest("[data-close-tab]");
    if (x) {
      var id = x.dataset.closeTab;
      S.tabs = S.tabs.filter(function (t) { return t.id !== id; });
      if (S.active === id) S.active = "inspector";
      renderStack();
      e.stopPropagation();
      return;
    }
    var t = e.target.closest("[data-tab]");
    if (t) { S.active = t.dataset.tab; renderStack(); }
  });

  /* the stack body: inspector and touchpoints, delegated */
  $("stackBody").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.id === "insMore") {
      if (OPEN && OPEN.opener === b) { closeLayer(true); return; }
      openLayer(b, inspectorMenu(), "end");
      return;
    }
    if (b.dataset.act === "apply") { applyDraft(); return; }
    if (b.dataset.act === "discard") { discardDraft(); return; }
    if (b.dataset.act === "addrow") { addRow(); return; }
    if (b.dataset.rm !== undefined && b.dataset.rm !== "") { removeValue(b.dataset.rm, +b.dataset.i); return; }
    if (b.dataset.add) { addValue(b.dataset.add); return; }
    if (b.dataset.exp) { EXPANDED[b.dataset.exp] = !EXPANDED[b.dataset.exp]; renderStack(); return; }
    if (b.dataset.rerun) { rerunTouchpoints(b.dataset.rerun); return; }
    if (b.dataset.tpexp) {
      var t = S.tabs.filter(function (x) { return x.id === S.active; })[0];
      if (t) { t.show[b.dataset.tpexp] = !t.show[b.dataset.tpexp]; renderStack(); }
      return;
    }
    if (b.dataset.goto) { gotoSubject(b.dataset.goto); return; }
    if (b.dataset.cls) { setClass(b.dataset.cls); return; }
  });
  $("stackBody").addEventListener("input", function (e) {
    var v = e.target.closest(".val");
    if (!v || v.hasAttribute("readonly")) return;
    var r = currentSubject();
    if (!r) return;
    var d = ensureDraft(r);
    var p = v.dataset.pred, i = +v.dataset.i;
    if (!d.p[p]) d.p[p] = [];
    d.p[p][i] = v.value;
    var slot = document.querySelector("#stackBody .state");
    if (slot && !slot.classList.contains("pending")) renderStackKeepFocus(v);
  });
  $("stackBody").addEventListener("keydown", function (e) {
    var r0 = currentSubject();
    if (e.key === "Escape" && r0 && S.drafts[r0.id]) { discardDraft(); }
  });
}

/* Repaint the header state without losing the caret. */
function renderStackKeepFocus(input) {
  var pred = input.dataset.pred, i = input.dataset.i, pos = input.selectionStart;
  renderStack();
  var again = document.querySelector('#stackBody .val[data-pred="' + CSS.escape(pred) + '"][data-i="' + i + '"]');
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) { /* not selectable */ } }
}
function addValue(pred) {
  var r = currentSubject();
  if (!r) return;
  var d = ensureDraft(r);
  if (!d.p[pred]) d.p[pred] = [];
  d.p[pred].push("");
  EXPANDED[pred] = true;
  renderStack();
  var list = document.querySelectorAll('#stackBody .val[data-pred="' + CSS.escape(pred) + '"]');
  if (list.length) list[list.length - 1].focus();
}
function removeValue(pred, i) {
  var r = currentSubject();
  if (!r) return;
  var d = ensureDraft(r);
  if (!d.p[pred]) return;
  d.p[pred].splice(i, 1);
  if (!d.p[pred].length) delete d.p[pred];
  renderStack();
}
function addRow() {
  var r = currentSubject();
  if (!r) return;
  var d = ensureDraft(r);
  var free = PRED_ORDER.filter(function (p) { return !d.p[p]; });
  var pred = free.length ? free[0] : "rdfs:seeAlso";
  if (d.p[pred]) d.p[pred].push(""); else d.p[pred] = [""];
  renderStack();
  var el = document.querySelector('#stackBody .val[data-pred="' + CSS.escape(pred) + '"]');
  if (el) el.focus();
}
function gotoSubject(id) {
  S.q = "";
  $("filter").value = "";
  $("filterClr").hidden = true;
  var idx = VIEW.findIndex(function (r) { return r.id === id; });
  if (idx < 0) { renderGrid(); idx = VIEW.findIndex(function (r) { return r.id === id; }); }
  if (idx >= 0) { S.page = Math.floor(idx / S.per) + 1; renderGrid(); }
  S.active = "inspector";
  select(id, false);
  renderStack();
}

/* The remaining values of a multi valued cell. The grid never concatenates
   values with a delimiter and never hides them behind a title attribute. */
function showValues(btn) {
  var id = btn.dataset.vals, key = btn.dataset.vk, r = null;
  for (var i = 0; i < ROWS.length; i++) if (ROWS[i].id === id) r = ROWS[i];
  if (!r) return;
  if (OPEN && OPEN.opener === btn) { closeLayer(true); return; }
  var vs = cellValues(r, BYKEY[key]);
  var n = document.createElement("div");
  n.className = "vpop";
  n.innerHTML = '<div class="vh2">' + esc(key) + " · " + vs.length + " values</div><ul>" +
    vs.map(function (v) { return "<li>" + esc(v) + "</li>"; }).join("") + "</ul>";
  openLayer(btn, n, "start");
}

boot();
</script>
</body>
</html>
