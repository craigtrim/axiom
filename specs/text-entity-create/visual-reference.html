<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiom: Text Entities</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ============================================================================
   Axiom — tokens
   ----------------------------------------------------------------------------
   Continues the chrome the app already draws: neutral desktop greys, one blue
   for focus and the primary action, system stack. Measured on white:
     text   #1c1f24  16.5:1     accent #0b5cad  6.7:1
     muted  #5c6470   6.0:1     danger #b3261e  6.5:1
   Highlight grounds all clear 13:1 with --text on them.
   Light only: the app ships light chrome and this does not invent a dark one.
   ========================================================================= */

:root {
  --chrome:      #f3f3f3;
  --chrome-2:    #e9eaec;
  --surface:     #ffffff;
  --surface-2:   #f7f8f9;
  --border:      #c9ced6;
  --border-soft: #e3e6ea;

  --text:        #1c1f24;
  --muted:       #5c6470;

  --accent:      #0b5cad;
  --accent-soft: #e8f1fb;
  --accent-line: #a8c8e8;
  --danger:      #b3261e;
  --danger-soft: #fdecea;

  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r: 4px; --r-lg: 6px; --r-pill: 999px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--chrome);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }

:where(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-radius: var(--r);
}
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ============================================================================
   Window and panes
   ========================================================================= */

.app { display: grid; grid-template-rows: minmax(0, 1fr) 6px minmax(0, 1fr); height: 100dvh; }
.app[data-top="48"] { grid-template-rows: 48fr 6px 52fr; }

.pane { display: grid; grid-template-rows: auto auto minmax(0, 1fr); background: var(--surface); min-height: 0; }

/* --- tab strip --- */
.tabs {
  display: flex; align-items: stretch; gap: 0;
  background: var(--chrome); border-bottom: 1px solid var(--border);
  padding-right: var(--s2);
}
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px 8px;
  background: none; border: 0; border-top: 2px solid transparent;
  color: var(--muted); cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] {
  color: var(--text); font-weight: 600;
  background: var(--surface); border-top-color: var(--accent);
}
.tab-close {
  display: grid; place-items: center; width: 16px; height: 16px; flex: none;
  background: none; border: 0; border-radius: var(--r); color: var(--muted); cursor: pointer;
}
.tab-close:hover { background: var(--chrome-2); color: var(--text); }
.tabs-end { margin-left: auto; display: flex; align-items: center; gap: 2px; padding-right: 4px; }
.icon-btn {
  display: grid; place-items: center; width: 26px; height: 26px;
  background: none; border: 0; border-radius: var(--r); color: var(--muted); cursor: pointer;
}
.icon-btn:hover { background: var(--chrome-2); color: var(--text); }
.icon { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6;
        stroke-linecap: round; stroke-linejoin: round; }

/* --- pane toolbar --- */
.bar {
  display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
  padding: var(--s2) var(--s3);
  border-bottom: 1px solid var(--border-soft);
  background: var(--surface);
}
.bar-title { font-weight: 650; }
.bar-file { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.bar-end { margin-left: auto; display: flex; align-items: center; gap: var(--s2); }
.bar-stat { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* --- buttons --- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 28px; padding: 0 12px;
  font-size: 13.5px; font-weight: 500;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--r);
  cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn--primary {
  background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
}
.btn--primary:hover:not(:disabled) { background: #0a4f95; border-color: #0a4f95; }
.btn--quiet { background: none; border-color: transparent; color: var(--muted); }
.btn--quiet:hover:not(:disabled) { background: var(--chrome-2); color: var(--text); }
.btn--seg { border-radius: 0; margin-left: -1px; }
.btn--seg:first-child { border-radius: var(--r) 0 0 var(--r); margin-left: 0; }
.btn--seg:last-child { border-radius: 0 var(--r) var(--r) 0; }
.btn--seg[aria-pressed="true"] {
  background: var(--accent-soft); border-color: var(--accent-line);
  color: var(--accent); font-weight: 600; position: relative; z-index: 1;
}

/* --- splitter --- */
.splitter {
  background: var(--chrome); border-block: 1px solid var(--border);
  cursor: row-resize; position: relative;
}
.splitter::after {
  content: ""; position: absolute; inset-inline: 50%; top: 2px; bottom: 2px;
  width: 30px; translate: -15px 0; border-radius: var(--r-pill); background: var(--border);
}
.splitter:hover::after, .splitter:focus-visible::after { background: var(--accent); }

/* ============================================================================
   Text Analysis pane — context, not the thing being redesigned
   ========================================================================= */

.hint { padding: 6px var(--s3); font-size: 12.5px; color: var(--muted);
        border-bottom: 1px solid var(--border-soft); }
.text-body { padding: var(--s3); overflow: auto; font-family: var(--mono); font-size: 13px; line-height: 2; }
.text-line { white-space: pre-wrap; }

.hl {
  padding: 1px 3px; margin: 0 -1px; border-radius: 3px;
  background: var(--hl, #eee); border: 0; border-bottom: 2px solid transparent;
  font: inherit; color: var(--text); cursor: pointer;
}
.hl:hover { border-bottom-color: var(--accent); }
.hl[aria-current="true"] { border-bottom-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* ============================================================================
   The entity pane — the redesign
   ----------------------------------------------------------------------------
   The five parent regions the old form had — suggested from the phrase,
   selected, add existing, create new, suggest with an assistant — are one
   region here: a chip list and one combobox. The assistant feeds that same
   combobox rather than owning a box of its own.

   The pane is wide and short, so the form is two columns and the footer is
   pinned. Nothing about this view scrolls in the common case.
   ========================================================================= */

.entity-body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.entity-body[data-mode="summary"] { grid-template-rows: minmax(0, 1fr); }

/* what you are adding, and where you are in the frame stack */
.context {
  display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap;
  padding: var(--s2) var(--s3);
  background: var(--surface-2); border-bottom: 1px solid var(--border-soft);
  font-size: 12.5px; color: var(--muted);
}
.context-phrase { font-family: var(--mono); color: var(--text); }
.context-phrase mark { background: #ffe0ec; color: var(--text); padding: 0 2px; border-radius: 2px; }
.crumb { display: inline-flex; align-items: center; gap: 6px; }
.crumb-back {
  display: inline-flex; align-items: center; gap: 4px;
  background: none; border: 0; padding: 2px 6px; margin-left: -6px;
  color: var(--accent); font-size: 12.5px; font-weight: 600;
  border-radius: var(--r); cursor: pointer;
}
.crumb-back:hover { background: var(--accent-soft); }
.crumb-sep { color: var(--border); }

.form { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr);
        gap: var(--s5); padding: var(--s4) var(--s3); overflow: auto; align-content: start; }

.col { display: grid; gap: var(--s4); align-content: start; }

/* one section treatment — no fieldset legends sitting on borders */
.sec-label {
  font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted); margin-bottom: var(--s2);
}
.field { display: grid; gap: 4px; }
.field > label { font-size: 12.5px; font-weight: 600; }
.field .help { font-size: 12px; color: var(--muted); }

input[type="text"], textarea, select {
  width: 100%; padding: 5px 8px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--r);
}
input[type="text"]:hover, textarea:hover { border-color: #aab2bd; }
textarea { resize: vertical; min-height: 56px; }
/* an input's width suggests how much belongs in it */
.field--name input { max-width: 340px; }
.field--desc textarea { max-width: 400px; }

.err { font-size: 12px; color: var(--danger); display: flex; align-items: center; gap: 5px; }
.field[data-invalid] input { border-color: var(--danger); background: var(--danger-soft); }

/* --- the one parents region ------------------------------------------- */

.parents { display: grid; gap: var(--s2); }

.chips {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  min-height: 34px; padding: 4px;
  background: var(--surface-2);
  border: 1px solid var(--border-soft); border-radius: var(--r);
}
.chip {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 2px 2px 2px 9px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-pill);
  font-size: 13px;
}
.chip[data-new] { border-style: dashed; border-color: var(--accent-line); background: var(--accent-soft); }
.chip-x {
  display: grid; place-items: center; width: 18px; height: 18px;
  background: none; border: 0; border-radius: var(--r-pill);
  color: var(--muted); cursor: pointer;
}
.chip-x:hover { background: var(--chrome-2); color: var(--danger); }
.chip-x .icon { width: 11px; height: 11px; stroke-width: 2; }
.chip-note { font-size: 11px; color: var(--muted); margin-left: 2px; }

/* empty is not blank: it states what will actually happen */
.chips-empty {
  display: flex; align-items: center; gap: 6px;
  padding-left: 5px; font-size: 13px; color: var(--muted);
}
.chips-empty code { font-family: var(--mono); font-size: 12.5px; color: var(--text); }

/* the combobox that replaced four controls */
.combo { position: relative; display: flex; gap: var(--s2); align-items: flex-start; }
.combo-field { flex: 1 1 auto; min-width: 0; max-width: 460px; }
.combo-field input { width: 100%; }

.listbox {
  position: absolute; z-index: 20; top: calc(100% + 3px); left: 0;
  width: min(460px, 100%);
  max-height: 232px; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: 0 6px 20px rgba(28, 31, 36, .16);
  padding: 4px;
}
.listbox[hidden] { display: none; }
.lb-group {
  padding: 6px 8px 3px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted);
}
.lb-opt {
  display: flex; align-items: baseline; gap: var(--s2);
  width: 100%; padding: 5px 8px;
  background: none; border: 0; border-radius: var(--r);
  text-align: left; cursor: pointer;
}
.lb-opt:hover, .lb-opt[data-active] { background: var(--accent-soft); }
.lb-opt strong { font-weight: 500; }
.lb-opt .lb-meta { margin-left: auto; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.lb-opt[data-create] strong { font-weight: 600; color: var(--accent); }
.lb-empty { padding: 10px 8px; font-size: 13px; color: var(--muted); }

/* the assistant: a control beside the combobox, feeding the same list */
.assist { display: flex; gap: 0; flex: none; }
.assist select {
  width: auto; border-radius: var(--r) 0 0 var(--r); border-right: 0;
  padding-right: 4px; background: var(--surface);
}
.assist .btn { border-radius: 0 var(--r) var(--r) 0; }
.assist-help { font-size: 12px; color: var(--muted); }

.spin {
  width: 13px; height: 13px; border-radius: var(--r-pill);
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(1turn); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* --- the existing-class branch ----------------------------------------- */

.notice {
  display: flex; align-items: flex-start; gap: var(--s2);
  padding: var(--s3); border-radius: var(--r-lg);
  background: var(--accent-soft); border: 1px solid var(--accent-line);
  font-size: 13px;
}
.notice .icon { color: var(--accent); flex: none; margin-top: 2px; }
.notice-body { display: grid; gap: var(--s2); }

/* --- pinned footer ------------------------------------------------------ */

.foot {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s2) var(--s3);
  background: var(--surface); border-top: 1px solid var(--border);
}
.foot-note { font-size: 12px; color: var(--muted); }
.foot-end { margin-left: auto; display: flex; align-items: center; gap: var(--s2); }

/* --- summary tab -------------------------------------------------------- */

.summary { padding: var(--s4) var(--s3); overflow: auto; }
.added { display: grid; gap: 6px; max-width: 620px; }
.added-row {
  display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap;
  padding: var(--s2) var(--s3);
  background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: var(--r);
}
.added-row strong { font-weight: 600; }
.added-row .under { font-size: 12.5px; color: var(--muted); }
.added-empty { font-size: 13px; color: var(--muted); }

@media (max-width: 900px) {
  .form { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
}
</style>
</head>

<script>
(() => {
'use strict';

/* ==========================================================================
   Fixtures — the ontology the text pane is matching against.
   Labels are the ones visible in the source screenshots of courses.owl
   (namespace http://devry.edu/courses#), not invented terms.
   ======================================================================== */

const NS = 'http://devry.edu/courses#';
const CLASSES = [
  'Algebra', 'Ceramics', 'Communication', 'Composition', 'Developmental Math',
  'English', 'Fine Arts', 'Health Science', 'Humanities', 'Mathematics',
  'Medical Terminology', 'Music', 'Patient Care', 'Performing Arts',
  'Phlebotomy', 'Psychology', 'Social Science', 'Sociology', 'Speech',
  'Young Child'
].map(label => ({ iri: NS + label.replace(/\s+/g, ''), label }));

const byLabel = l => CLASSES.find(c => c.label.toLowerCase() === l.trim().toLowerCase());

/* The text pane's content, verbatim from the screenshot. A `~` wraps a phrase
   that the ontology matched; the tint is per matched class so two lines of the
   same course read the same colour. */
const TINTS = {
  Ceramics: '#d8f3f0', 'Young Child': '#ffe6d6', Composition: '#efe0ff',
  Speech: '#d9f2e4', 'Patient Care': '#ffe3e3', Phlebotomy: '#fff2cc',
  Music: '#ffe0ec', Psychology: '#ffe6d6', Sociology: '#e6f7d9',
  'Developmental Math': '#fff6cc', Algebra: '#d8f3f0', 'Medical Terminology': '#ffe3e3',
  Introduction: '#e8f1fb', 'Life-Span': '#efe0ff', Developmental: '#ffe6d6'
};

const LINES = [
  '~Ceramics~ I',
  'Growth & ~Dev./Young Child~',
  '~Composition~ I',
  '~Speech~ Fundamentals',
  '~Patient Care~ Modules',
  '~Introduction~ to ~Phlebotomy~',
  '~Composition~ I',
  '~Introduction~ to ~American Music~',
  '~Life-Span~ ~Developmental Psycho~',
  'General ~Sociology~',
  'College : changes , challenges, cho',
  '~Developmental Math~',
  'College : changes, challenges, cho',
  '~Developmental Math~',
  '~Life-Span~ ~Developmental Psycho~',
  'Beginning ~Algebra~',
  '~Life-Span~ ~Developmental Psycho~',
  'Beginning ~Algebra~',
  '~Life-Span~ ~Developmental Psycho~',
  '~Medical Terminology~'
];

/* ==========================================================================
   State
   ------------------------------------------------------------------------
   `frames` is a stack, mirroring TextEntityCreate's own model: creating a new
   parent pushes a nested draft of this same form, and the whole stack is
   written when the outermost class is added. The old view gave no sign you
   were inside a nested frame; this one carries a breadcrumb.
   ======================================================================== */

const state = {
  mode: 'add',
  phrase: 'American Music',
  sourceLine: 'Introduction to American Music',
  frames: [],
  added: [],
  comboOpen: false,
  comboText: '',
  active: -1,
  assistant: 'Claude',
  assistBusy: false,
  assistResults: null,
  error: ''
};

const newFrame = label => ({ label, comment: '', parents: [] });
const frame = () => state.frames[state.frames.length - 1];

function startDraft(phrase, line) {
  state.phrase = phrase;
  state.sourceLine = line;
  state.frames = [newFrame(phrase)];
  state.assistResults = null;
  state.comboText = '';
  state.error = '';
  // a phrase that already names a class is a different situation, handled in render
  const exact = byLabel(phrase);
  if (!exact) {
    const suggested = CLASSES.filter(c =>
      new RegExp('(^|\\s)' + c.label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\s|$)', 'i').test(phrase)
    );
    frame().parents = suggested.map(c => ({ iri: c.iri, label: c.label }));
  }
}

const el = (tag, props, kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of [].concat(kids || [])) { if (kid !== null && kid !== undefined && kid !== false) n.append(kid); }
  return n;
};
const icon = name => {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'icon'); s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  u.setAttribute('href', '#' + name); s.append(u); return s;
};

/* ==========================================================================
   The text pane
   ======================================================================== */

function renderText() {
  document.getElementById('text-body').replaceChildren(...LINES.map(line => {
    const row = el('div', { class: 'text-line' });
    line.split('~').forEach((part, i) => {
      if (!part) return;
      if (i % 2 === 0) { row.append(document.createTextNode(part)); return; }
      const tintKey = Object.keys(TINTS).find(k => part.includes(k)) || part;
      row.append(el('button', {
        class: 'hl',
        style: '--hl:' + (TINTS[tintKey] || '#eceff3'),
        'aria-current': String(part === state.phrase),
        title: byLabel(part) ? part + ' is already a class' : 'Add “' + part + '” as a class',
        onclick: () => { startDraft(part, line.replace(/~/g, '')); state.mode = 'add'; render(); }
      }, part));
    });
    return row;
  }));
}

/* ==========================================================================
   The parents region — one chip list, one combobox, one assistant control
   ======================================================================== */

function parentChips() {
  const f = frame();
  if (!f.parents.length) {
    return el('div', { class: 'chips' }, [
      el('span', { class: 'chips-empty' }, [
        icon('i-info'),
        el('span', { html: 'No parent chosen. Will be added under <code>Thing</code>' })
      ])
    ]);
  }
  return el('div', { class: 'chips' }, f.parents.map((p, i) => {
    const isNew = !('iri' in p);
    const label = isNew ? p.create.label : p.label;
    return el('span', { class: 'chip', dataset: isNew ? { new: '' } : {} }, [
      document.createTextNode(label),
      isNew ? el('span', { class: 'chip-note', text: 'new' }) : null,
      el('button', {
        class: 'chip-x', type: 'button',
        title: 'Remove ' + label,
        onclick: () => { f.parents.splice(i, 1); render(); }
      }, [icon('i-x'), el('span', { class: 'sr', text: 'Remove ' + label })])
    ]);
  }));
}

/* Everything that can become a parent, in one list, grouped by where it came
   from. Suggested-from-phrase, Add existing parent, Create new parent and the
   assistant were four separate controls in the old view; here they are four
   groups in one dropdown, and all four end in the same chip list. */
function comboOptions() {
  const f = frame();
  const q = state.comboText.trim();
  const taken = new Set(f.parents.map(p => 'iri' in p ? p.iri : 'new:' + p.create.label.toLowerCase()));
  const match = c => !q || c.label.toLowerCase().includes(q.toLowerCase());
  const groups = [];

  const fromPhrase = CLASSES.filter(c =>
    new RegExp('(^|\\s)' + c.label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\s|$)', 'i').test(state.phrase)
  ).filter(c => !taken.has(c.iri) && match(c));
  if (fromPhrase.length) groups.push({ name: 'From the phrase', items: fromPhrase });

  if (state.assistResults) {
    const items = state.assistResults.filter(c => !taken.has(c.iri) && match(c));
    if (items.length) groups.push({ name: 'Suggested by ' + state.assistant, items });
  }

  const rest = CLASSES.filter(c =>
    !taken.has(c.iri) && match(c) &&
    !fromPhrase.some(p => p.iri === c.iri) &&
    !(state.assistResults || []).some(p => p.iri === c.iri)
  );
  if (rest.length) groups.push({ name: 'Existing classes', items: rest.slice(0, 8) });

  if (q && !byLabel(q) && !taken.has('new:' + q.toLowerCase())) {
    groups.push({ name: 'Create', items: [{ create: q }] });
  }
  return groups;
}

function flatOptions(groups) { return groups.flatMap(g => g.items); }

function chooseOption(opt) {
  const f = frame();
  if (opt.create) {
    // pushes a nested frame — the same form, one level down
    state.frames.push(newFrame(opt.create));
    state.comboText = ''; state.comboOpen = false; state.active = -1;
    state.assistResults = null;
    render();
    return;
  }
  f.parents.push({ iri: opt.iri, label: opt.label });
  state.comboText = ''; state.active = -1;
  render();
  const input = document.getElementById('combo-input');
  if (input) input.focus();
}

function parentsRegion() {
  const groups = state.comboOpen ? comboOptions() : [];
  const flat = flatOptions(groups);
  const list = el('div', {
    class: 'listbox', id: 'combo-list', role: 'listbox', hidden: !state.comboOpen || undefined,
    'aria-label': 'Parent classes'
  });

  if (state.comboOpen) {
    if (!flat.length) {
      list.append(el('p', { class: 'lb-empty', text: 'No class matches that. Keep typing to create one.' }));
    } else {
      let idx = 0;
      for (const g of groups) {
        list.append(el('div', { class: 'lb-group', text: g.name }));
        for (const item of g.items) {
          const i = idx++;
          list.append(el('button', {
            type: 'button', class: 'lb-opt', role: 'option', id: 'opt-' + i,
            'aria-selected': String(i === state.active),
            dataset: Object.assign({ i: String(i) },
              i === state.active ? { active: '' } : {},
              item.create ? { create: '' } : {}),
            onmousedown: e => { e.preventDefault(); chooseOption(item); }
          }, [
            el('strong', { text: item.create ? 'Create “' + item.create + '” as a new parent' : item.label }),
            item.create ? null : el('span', { class: 'lb-meta', text: item.iri.replace(NS, ':') })
          ]));
        }
      }
    }
  }

  const input = el('input', {
    type: 'text', id: 'combo-input', role: 'combobox', autocomplete: 'off',
    'aria-expanded': String(state.comboOpen), 'aria-controls': 'combo-list',
    'aria-activedescendant': state.active >= 0 ? 'opt-' + state.active : null,
    placeholder: 'Search classes, or type a new name…',
    value: state.comboText,
    oninput: e => { state.comboText = e.target.value; state.comboOpen = true; state.active = -1; render(true); },
    onfocus: () => { if (!state.comboOpen) { state.comboOpen = true; render(true); } },
    onblur: () => { window.setTimeout(() => { if (state.comboOpen) { state.comboOpen = false; render(); } }, 120); },
    onkeydown: e => {
      const g = comboOptions(), f2 = flatOptions(g);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!state.comboOpen) { state.comboOpen = true; state.active = 0; return render(true); }
        const d = e.key === 'ArrowDown' ? 1 : -1;
        state.active = (state.active + d + f2.length + (state.active < 0 && d < 0 ? 1 : 0)) % Math.max(f2.length, 1);
        render(true);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (state.comboOpen && f2[state.active]) chooseOption(f2[state.active]);
        else if (f2.length === 1) chooseOption(f2[0]);
      } else if (e.key === 'Escape') {
        if (state.comboOpen) { e.stopPropagation(); state.comboOpen = false; state.active = -1; render(true); }
      }
    }
  });

  return el('div', { class: 'parents' }, [
    parentChips(),
    el('div', { class: 'combo' }, [
      el('div', { class: 'combo-field' }, [input, list]),
      el('div', { class: 'assist' }, [
        el('select', {
          'aria-label': 'Assistant',
          onchange: e => { state.assistant = e.target.value; state.assistResults = null; render(); }
        }, ['Claude', 'Codex'].map(n =>
          el('option', { value: n, selected: n === state.assistant || null, text: n }))),
        el('button', {
          class: 'btn', type: 'button', disabled: state.assistBusy || null,
          onclick: runAssistant
        }, [
          state.assistBusy ? el('span', { class: 'spin' }) : icon('i-spark'),
          document.createTextNode(state.assistBusy ? 'Thinking…' : 'Suggest')
        ])
      ])
    ]),
    el('p', { class: 'assist-help', text: state.assistResults
      ? state.assistant + ' suggested ' + state.assistResults.length + ' parents. They are in the list above, under its name.'
      : 'Uses your installed ' + state.assistant + ' sign-in. Suggestions appear in the same list.' })
  ]);
}

/* The assistant proposes from classes that already exist in the ontology, so a
   suggestion is always something you could have found yourself. */
function runAssistant() {
  state.assistBusy = true; render();
  window.setTimeout(() => {
    const label = frame().label.toLowerCase();
    const pool = label.includes('music') ? ['Performing Arts', 'Humanities', 'Fine Arts']
      : label.includes('psycho') ? ['Psychology', 'Social Science']
      : label.includes('math') || label.includes('algebra') ? ['Mathematics']
      : label.includes('medical') || label.includes('patient') || label.includes('phleb') ? ['Health Science']
      : ['Humanities', 'Social Science'];
    state.assistResults = pool.map(byLabel).filter(Boolean);
    state.assistBusy = false;
    state.comboOpen = true;
    render();
    const i = document.getElementById('combo-input'); if (i) i.focus();
  }, 900);
}

/* ==========================================================================
   The form
   ======================================================================== */

function contextRow() {
  const nested = state.frames.length > 1;
  const bits = [];
  if (nested) {
    bits.push(el('button', {
      class: 'crumb-back', type: 'button',
      onclick: () => { state.frames.pop(); state.comboText = ''; state.assistResults = null; render(); }
    }, [icon('i-back'), document.createTextNode(state.frames[state.frames.length - 2].label)]));
    bits.push(el('span', { class: 'crumb-sep', text: '›' }));
    bits.push(el('span', { text: 'new parent' }));
  } else {
    const line = state.sourceLine;
    const at = line.toLowerCase().indexOf(state.phrase.toLowerCase());
    bits.push(el('span', { text: 'Adding from selection' }));
    bits.push(el('span', { class: 'context-phrase' }, at < 0
      ? [document.createTextNode(state.phrase)]
      : [
          document.createTextNode(line.slice(0, at)),
          el('mark', { text: line.slice(at, at + state.phrase.length) }),
          document.createTextNode(line.slice(at + state.phrase.length))
        ]));
  }
  return el('div', { class: 'context' }, bits);
}

function existingBranch(existing) {
  const nested = state.frames.length > 1;
  return el('div', { class: 'form' }, [
    el('div', { class: 'col', style: 'grid-column:1 / -1;max-width:640px' }, [
      el('div', { class: 'notice' }, [
        icon('i-info'),
        el('div', { class: 'notice-body' }, [
          el('p', { html: '<strong>' + existing.label + '</strong> already exists in this ontology. Adding it again would create a duplicate.' }),
          el('div', { class: 'od-cluster' }, [
            el('button', { class: 'btn', type: 'button', text: nested ? 'Use ' + existing.label + ' as parent' : 'Open ' + existing.label + ' in Taxonomy',
              onclick: () => {
                if (nested) {
                  state.frames.pop();
                  frame().parents.push({ iri: existing.iri, label: existing.label });
                }
                render();
              } }),
            el('span', { class: 'bar-file', text: existing.iri.replace(NS, ':') })
          ])
        ])
      ])
    ])
  ]);
}

function formBody() {
  const f = frame();
  const nested = state.frames.length > 1;
  const existing = byLabel(f.label);
  if (existing) return existingBranch(existing);

  return el('div', { class: 'form' }, [
    el('div', { class: 'col' }, [
      el('div', {}, [
        el('p', { class: 'sec-label', text: 'Class' }),
        el('div', { class: 'field field--name', dataset: state.error ? { invalid: '' } : {} }, [
          el('label', { for: 'f-name', text: 'Name' }),
          el('input', {
            type: 'text', id: 'f-name', maxlength: '256', value: f.label,
            'aria-describedby': state.error ? 'f-name-err' : null,
            oninput: e => { f.label = e.target.value; if (state.error) { state.error = ''; render(true); } }
          }),
          state.error ? el('p', { class: 'err', id: 'f-name-err' }, [icon('i-info'), document.createTextNode(state.error)]) : null
        ])
      ]),
      el('div', { class: 'field field--desc' }, [
        el('label', { for: 'f-desc', text: 'Description' }),
        el('textarea', {
          id: 'f-desc', maxlength: '10000', rows: '3',
          placeholder: 'Optional',
          oninput: e => { f.comment = e.target.value; }
        }, f.comment)
      ])
    ]),

    el('div', { class: 'col' }, [
      el('div', {}, [
        el('p', { class: 'sec-label', text: 'Parents' }),
        parentsRegion()
      ])
    ])
  ]);
}

function footer() {
  const f = frame();
  const nested = state.frames.length > 1;
  const existing = byLabel(f.label);
  return el('div', { class: 'foot' }, [
    el('span', { class: 'foot-note', text: nested
      ? 'Saved together with ' + state.frames[0].label + ' when you add it.'
      : (f.parents.length ? '' : 'Adding under Thing.') }),
    el('div', { class: 'foot-end' }, [
      el('button', {
        class: 'btn btn--quiet', type: 'button',
        onclick: () => {
          if (nested) { state.frames.pop(); } else { state.frames = []; state.mode = 'summary'; }
          render();
        }
      }, nested ? 'Discard parent' : 'Cancel'),
      existing ? null : el('button', {
        class: 'btn btn--primary', type: 'button', onclick: submit
      }, nested ? 'Use as parent' : 'Add class')
    ])
  ]);
}

function submit() {
  const f = frame();
  if (!f.label.trim()) { state.error = 'A class needs a name.'; render(); document.getElementById('f-name').focus(); return; }
  if (state.frames.length > 1) {
    const child = state.frames.pop();
    frame().parents.push({ create: child });
    state.comboText = ''; state.assistResults = null;
    render();
    return;
  }
  const parents = f.parents.length
    ? f.parents.map(p => 'iri' in p ? p.label : p.create.label + ' (new)')
    : ['Thing'];
  state.added.unshift({ label: f.label.trim(), parents });
  // a created parent is a real class too, written with the original
  for (const p of f.parents) if (!('iri' in p)) {
    state.added.unshift({ label: p.create.label, parents: p.create.parents.length
      ? p.create.parents.map(q => 'iri' in q ? q.label : q.create.label) : ['Thing'] });
  }
  state.frames = [];
  state.mode = 'summary';
  render();
}

function summaryBody() {
  return el('div', { class: 'summary' }, [
    el('p', { class: 'sec-label', text: 'Added this session' }),
    state.added.length
      ? el('div', { class: 'added' }, state.added.map(a =>
          el('div', { class: 'added-row' }, [
            el('strong', { text: a.label }),
            el('span', { class: 'under', text: 'under ' + a.parents.join(', ') })
          ])))
      : el('p', { class: 'added-empty', text: 'Nothing added yet. Click a highlighted phrase in the text above to start.' })
  ]);
}

/* ==========================================================================
   Render
   ======================================================================== */

function render(keepFocus) {
  const focusId = keepFocus && document.activeElement ? document.activeElement.id : null;
  const selStart = keepFocus && document.activeElement && 'selectionStart' in document.activeElement
    ? document.activeElement.selectionStart : null;

  document.getElementById('mode-summary').setAttribute('aria-pressed', String(state.mode === 'summary'));
  document.getElementById('mode-add').setAttribute('aria-pressed', String(state.mode === 'add'));

  const body = document.getElementById('entity-body');
  const showing = state.mode === 'summary' || !state.frames.length ? 'summary' : 'add';
  body.dataset.mode = showing;
  if (showing === 'summary') body.replaceChildren(summaryBody());
  else body.replaceChildren(contextRow(), formBody(), footer());
  renderText();

  if (focusId) {
    const n = document.getElementById(focusId);
    if (n) { n.focus(); if (selStart !== null && 'setSelectionRange' in n) n.setSelectionRange(selStart, selStart); }
  }
}

/* --- the splitter -------------------------------------------------------- */
(() => {
  const app = document.getElementById('app'), bar = document.getElementById('splitter');
  const set = pct => {
    const v = Math.min(78, Math.max(22, pct));
    app.style.gridTemplateRows = v + 'fr 6px ' + (100 - v) + 'fr';
    bar.setAttribute('aria-valuenow', String(Math.round(v)));
  };
  let dragging = false;
  bar.addEventListener('pointerdown', e => { dragging = true; bar.setPointerCapture(e.pointerId); });
  bar.addEventListener('pointermove', e => {
    if (!dragging) return;
    set((e.clientY / app.getBoundingClientRect().height) * 100);
  });
  bar.addEventListener('pointerup', e => { dragging = false; bar.releasePointerCapture(e.pointerId); });
  bar.addEventListener('keydown', e => {
    const cur = Number(bar.getAttribute('aria-valuenow') || 48);
    if (e.key === 'ArrowUp') { e.preventDefault(); set(cur - 3); }
    if (e.key === 'ArrowDown') { e.preventDefault(); set(cur + 3); }
    if (e.key === 'Enter') { e.preventDefault(); set(48); }
  });
  set(48);
})();

document.getElementById('mode-summary').addEventListener('click', () => { state.mode = 'summary'; render(); });
document.getElementById('mode-add').addEventListener('click', () => {
  state.mode = 'add';
  if (!state.frames.length) startDraft(state.phrase, state.sourceLine);
  render();
});

startDraft('American Music', 'Introduction to American Music');
render();
})();
</script>
</body>
