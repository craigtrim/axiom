<text class="uc" x="916" y="160">ENTITY</text>
<rect class="ghost" x="1156" y="144" width="28" height="24" rx="4"/><text class="us" x="1170" y="160" text-anchor="middle">✓</text>
<rect class="ghost" x="1188" y="144" width="28" height="24" rx="4"/><text class="us" x="1202" y="160" text-anchor="middle">◎</text>
