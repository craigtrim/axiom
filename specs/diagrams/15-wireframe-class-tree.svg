<text class="mn" x="270" y="800" font-size="13" fill="#0F6CBD">pizza:MozzarellaTopping</text>
<path class="dl" d="M64 824 L64 832 M88 824 L88 832 M64 828 L88 828"/>
<text class="dim" x="96" y="832">kind marker — flex:none, --text-secondary</text>
<path class="dl" d="M96 848 L96 856 M604 848 L604 856 M96 852 L604 852"/>
<text class="dim" x="96" y="872">body — od-fill, mono 13px, overflow-wrap:anywhere; every IRI is an --accent link</text>
<text class="mns" x="52" y="898">padding 4px 8px · radius 4 · line-height 1.5 · hover fills with --layer-hover</text>
<rect x="52" y="908" width="560" height="22" rx="4" fill="#F7F7F7"/>
<rect x="52" y="908" width="2" height="22" fill="#B36A00"/>
<text class="mn" x="64" y="923">inferred variant — 2px left rule in --e-defined, reserved for a future reasoner</text>

<rect class="card" x="648" y="740" width="600" height="200" rx="8"/>
<text class="h" x="668" y="766">Section header and empty state</text>
<text class="uc" x="668" y="792">SUBCLASS OF</text>
<path class="div" d="M748 788 L1090 788"/>
<rect class="ghost" x="1100" y="780" width="128" height="18" rx="9" fill="#FAFAFA"/>
<text class="us" x="1110" y="793">from Margherita</text>
<text class="ps" x="668" y="816">Title is 12px 600 uppercase with 0.02em tracking in --text-secondary; the rule is a 1px</text>
<text class="ps" x="668" y="832">--stroke-divider that absorbs the remaining width; the optional chip sits after it.</text>
<rect x="668" y="846" width="560" height="76" rx="4" fill="#FAFAFA" stroke="#E1E1E1" stroke-width="1.5"/>
<rect x="932" y="858" width="18" height="18" rx="4.5" fill="none" stroke="#8A8A8A" stroke-width="1.5"/>
<text class="ub" x="948" y="896" text-anchor="middle">Nothing selected</text>
<text class="us" x="948" y="912" text-anchor="middle">Pick a class in the hierarchy, a node in the graph, or a row in the individuals table.</text>

<text class="cap" x="32" y="968">Figure 15 · Hierarchy panel and inspector. Illustrates 30-class-tree-and-inspector.md, “Tree row”, “Row states” and “Inspector sections”. [src: renderTree(), renderInspector(), section(), axiom()]</text>
<text class="cap" x="32" y="988">Indentation is padding-left: 4 + depth × 14 px, applied to the row rather than to a wrapper, so the hover and selection fills always span the full panel width.</text>
</svg>
