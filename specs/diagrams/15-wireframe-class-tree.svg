<text class="mns" x="700" y="539">--layer-selected</text>
<rect x="388" y="554" width="448" height="24" rx="4" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/>
<rect x="404" y="560" width="13" height="13" rx="3" fill="#0F6CBD"/>
