<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1010" width="1280" height="1010" role="img" aria-labelledby="fig15-title fig15-desc">
<title id="fig15-title">Figure 15 — Hierarchy panel and inspector, in detail</title>
<desc id="fig15-desc">The 280 pixel hierarchy panel and the 320 pixel inspector drawn at their specified sizes, with a magnified tree row showing the padding, twisty, icon, label and count, a panel of every row state, and magnified anatomies of the axiom row and the section header.</desc>
