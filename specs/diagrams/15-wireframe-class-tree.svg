<text class="ps" x="48" y="716">Only open rows exist in the DOM, so depth costs nothing.</text>

<rect class="card" x="368" y="104" width="500" height="300" rx="8"/>
<text class="h" x="388" y="130">Tree row anatomy · 1.6×</text>
<rect class="panel" x="388" y="146" width="448" height="38" rx="6"/>
<path class="dl" d="M388 196 L388 204 M394 196 L394 204 M388 200 L394 200"/>
<text class="dim" x="400" y="204">4 + depth × 14</text>
<rect class="ghost" x="394" y="152" width="26" height="26" rx="3"/>
<text class="us" x="407" y="170" text-anchor="middle">⌄</text>
<rect x="428" y="154" width="22" height="22" rx="5" fill="#0F6CBD"/>
<text class="u" x="460" y="170" font-size="14">Vegetable Topping</text>
<text class="us" x="826" y="170" text-anchor="end" font-size="12">14</text>
<path class="dl" d="M394 216 L394 224 M420 216 L420 224 M394 220 L420 220"/>
<text class="dim" x="426" y="224">twisty 16 — rotates 90° when open, visibility:hidden on a leaf</text>
<path class="dl" d="M428 240 L428 248 M450 240 L450 248 M428 244 L450 244"/>
<text class="dim" x="456" y="248">icon 14, tinted by KIND_META[kind].colour</text>
<path class="dl" d="M460 264 L460 272 M820 264 L820 272 M460 268 L820 268"/>
<text class="dim" x="460" y="288">label — od-fill, ellipsised; count is nowrap and only rendered when non-zero</text>
<text class="mns" x="388" y="330">height 24 (--h-tree-row) · gap 6 · margin 0 4px · radius 4 (--r-control) · padding-right 8</text>
<text class="ps" x="388" y="352">The count is the number of direct instances of the class, not the subtree size — the inspector</text>
<text class="ps" x="388" y="370">reports both, and they answer different questions.</text>
<text class="ps" x="388" y="392">aria-level is depth + 1; aria-expanded is omitted entirely on a leaf rather than set to false.</text>

<rect class="card" x="368" y="420" width="500" height="304" rx="8"/>
<text class="h" x="388" y="446">Row states</text>
<rect x="388" y="458" width="448" height="24" rx="4" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/>
