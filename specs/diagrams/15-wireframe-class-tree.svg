<text class="mns" x="920" y="262">pizza/pizza.owl#CheesyPizza</text>
<text class="uc" x="920" y="290">EQUIVALENT TO</text><path class="div" d="M1012 286 L1208 286"/>
<rect x="920" y="296" width="288" height="42" rx="4" fill="#F7F7F7"/>
<text class="mns" x="928" y="312">≡</text><text class="acc" x="948" y="312">pizza:Pizza</text>
<text class="mns" x="948" y="328">and pizza:hasTopping some</text>
<text class="acc" x="1090" y="328">pizza:Chees…</text>
<text class="uc" x="920" y="360">SUBCLASS OF</text><path class="div" d="M1000 356 L1208 356"/>
<text class="mns" x="928" y="378">⊑</text><text class="acc" x="948" y="378">pizza:Pizza</text>
<text class="uc" x="920" y="406">ANNOTATIONS</text><path class="div" d="M1004 402 L1208 402"/>
<text class="mns" x="928" y="424">rdfs:comment</text>
<text class="us" x="920" y="442">A pizza carrying at least one cheese topping.</text>
<text class="uc" x="920" y="470">USAGE</text><path class="div" d="M960 466 L1208 466"/>
<text class="us" x="920" y="490">Subclasses</text><text class="u" x="1030" y="490">0</text>
<text class="us" x="920" y="508">Descendants</text><text class="u" x="1030" y="508">0</text>
<text class="us" x="920" y="526">Direct instances</text><text class="u" x="1030" y="526">0</text>
<text class="uc" x="920" y="556">INFERRED AXIOMS</text><path class="div" d="M1032 552 L1208 552"/>
<rect x="920" y="562" width="288" height="52" rx="4" fill="#FAFAFA" stroke="#C4C4C4" stroke-width="1" stroke-dasharray="4 3"/>
<text class="us" x="930" y="580">ⓘ  No reasoner has run. This prototype shows</text>
<text class="us" x="930" y="596">asserted axioms only; inferred axioms would</text>
<text class="us" x="930" y="612">appear here, marked with the amber rule.</text>
<text class="ps" x="904" y="716">Sections render only when they have content; there is no empty “Disjoint with” heading.</text>

<rect class="card" x="32" y="740" width="600" height="200" rx="8"/>
<text class="h" x="52" y="766">Axiom row anatomy · 1.6×</text>
<rect x="52" y="778" width="560" height="34" rx="6" fill="#F7F7F7"/>
<text class="mn" x="64" y="800" font-size="13">⊑</text>
