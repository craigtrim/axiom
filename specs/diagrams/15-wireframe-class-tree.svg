<text class="mns" x="700" y="571">--accent-subtle behind the label only</text>
<rect x="388" y="586" width="448" height="24" rx="4" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/>
<rect x="404" y="592" width="13" height="13" rx="3" fill="#0F6CBD"/><text class="u" x="426" y="603">Leaf — the twisty keeps its space, loses its glyph</text>
<rect x="388" y="618" width="448" height="24" rx="4" fill="#FFFFFF" stroke="#E1E1E1" stroke-width="1"/>
<rect x="404" y="624" width="13" height="13" rx="3" fill="#0F6CBD"/>
<rect x="422" y="622" width="120" height="20" rx="2" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="1.5"/>
<text class="u" x="428" y="636">Vegetable Toppin|</text>
<text class="mns" x="700" y="636">rename, F2 — 20px inline input</text>
<rect x="388" y="654" width="448" height="24" rx="4" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="2"/>
<rect x="404" y="660" width="13" height="13" rx="3" fill="#0F6CBD"/><text class="u" x="426" y="671">Keyboard focus — 2px --accent ring, 1px offset</text>
<text class="ps" x="388" y="700">Arrow keys move the selection and scroll it into view; Right and Left open and close;</text>
