<text class="fig" x="32" y="30">FIGURE 15</text>
<text class="title" x="32" y="58">Hierarchy panel and entity inspector — parts and states</text>
<text class="sub" x="32" y="80">Both panels drawn at their default widths. Indentation, row height and every gap are the literal values from the implementation.</text>

