<text class="fig" x="32" y="30">FIGURE 10</text>
<text class="title" x="32" y="58">Radial layout — depth rings from the focus, wedges by subtree leaf count</text>
<text class="sub" x="32" y="80">Seventeen nodes, focus pizza:Pizza. Ring radii are drawn to scale at 75%; the annotated values are the world-space radii the algorithm produces.</text>

