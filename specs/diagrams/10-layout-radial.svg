<text class="rl" x="493" y="595">ring 2 · r = 236</text>
<text class="rl" x="556" y="658">ring 3 · r = 354</text>

<text class="lab" x="52" y="856">SHADED: NAMED PIZZA OWNS 4 OF 11 LEAVES → 130.9° · HAS TOPPING OWNS 1 OF 11 → 32.7° · EVERY DESCENDANT STAYS INSIDE ITS PARENT’S WEDGE</text>

<rect class="card" x="720" y="104" width="528" height="192" rx="8"/>
<text class="h" x="740" y="132">The ring radius rule</text>
<text class="mn" x="740" y="156">radii[0] = 0;</text>
<text class="mn" x="740" y="174">for (let d = 1; d &lt;= maxD; d++)</text>
<text class="mn" x="740" y="192">  radii[d] = Math.max(radii[d−1] + 118,</text>
<text class="mn" x="740" y="210">                      countAt[d] * 52 / (2π));</text>
<text class="ps" x="740" y="234">Two constraints, whichever binds: a minimum gap of 118 between rings, and</text>
<text class="ps" x="740" y="252">enough circumference to seat every node at that depth 52 apart.</text>
<text class="mns" x="740" y="276">d1: max(118, 4×52/2π = 33) = 118  ·  d2: max(236, 66) = 236  ·  d3: max(354, 41) = 354</text>

<rect class="card" x="720" y="312" width="528" height="192" rx="8"/>
<text class="h" x="740" y="340">Wedges by subtree leaf count</text>
<text class="ps" x="740" y="362">Leaves are counted in reverse BFS order, so no recursion is needed: a node with</text>
<text class="ps" x="740" y="380">no children counts 1, otherwise it sums its children.</text>
<text class="mn" x="740" y="404">Named Pizza 4 = Margherita 2 + Mushroom 1 + American 1</text>
<text class="mn" x="740" y="422">Pizza Base 2 · Pizza Topping 4 · has Topping 1</text>
<text class="mn" x="740" y="440">Pizza 11 — the sum of its four children</text>
<text class="ps" x="740" y="464">span(child) = (a1 − a0) × leaves(child) / Σ leaves(children). A subtree gets the</text>
<text class="ps" x="740" y="482">angle its content needs, so a broad branch is never squeezed beside a thin one.</text>

<rect class="card" x="720" y="520" width="528" height="164" rx="8"/>
<text class="h" x="740" y="548">Roots, orphans and the origin</text>
<text class="ps" x="740" y="570">Roots are the focus set intersected with the view. With no focus, the node with</text>
<text class="ps" x="740" y="588">the highest in-view degree is used instead, so the layout always has a centre.</text>
<text class="ps" x="740" y="610">Several roots share the full circle in proportion to their leaf counts, starting</text>
<text class="ps" x="740" y="628">at −π/2 — straight up — so the first branch is always at twelve o’clock.</text>
<text class="ps" x="740" y="650">A node the BFS never reaches is an orphan: maxD is incremented and the orphans</text>
<text class="ps" x="740" y="668">are spread evenly around that extra outer ring rather than piled at the centre.</text>

<rect class="card" x="720" y="700" width="528" height="180" rx="8"/>
<text class="h" x="740" y="728">After placement</text>
<text class="mns" x="740" y="750">resolveCollisions(3) · G.radialRings = radii.slice(1) · centreNodes(nodes)</text>
<text class="ps" x="740" y="774">Three collision passes nudge apart anything the wedge arithmetic still overlapped —</text>
<text class="ps" x="740" y="792">a node's radius grows with its degree, so equal angles are not equal space.</text>
<text class="ps" x="740" y="814">The rings are drawn in world space, so the origin is recorded after centring:</text>
<text class="mns" x="740" y="836">G.ringOrigin = position of roots[0] — not (0, 0)</text>
<text class="ps" x="740" y="858">Velocities are zeroed. Radial is computed once; there is nothing to freeze.</text>

<text class="cap" x="32" y="916">Figure 10 · Radial layout. Illustrates 21-layout-algorithms.md, “Radial”. [src: layoutRadial(), renderScene() ring pass]</text>
<text class="cap" x="32" y="936">chooseLayout() reaches radial when the focus set holds at most two nodes and more than fourteen nodes are in view — a neighbourhood being read outward from one thing.</text>
</svg>
