<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="1280" height="960" role="img" aria-labelledby="fig10-title fig10-desc">
<title id="fig10-title">Figure 10 — Radial layout: depth rings and leaf-count wedges</title>
<desc id="fig10-desc">A focus node at the centre with three depth rings around it. Each child of the focus owns an angular wedge whose width is proportional to the number of leaves in its subtree, and every descendant is placed inside its parent's wedge. Two wedges are shaded to contrast a four-leaf subtree with a one-leaf subtree. Panels on the right give the ring radius rule with worked numbers, the leaf-count table, the handling of multiple roots and orphans, and what happens after placement.</desc>
