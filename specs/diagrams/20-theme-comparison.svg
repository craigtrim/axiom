<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="fig20-title fig20-desc">
<title id="fig20-title">Figure 20 — Light and dark, side by side</title>
<desc id="fig20-desc">The same panel fragment — panel header, tree rows including a selected row, a graph canvas strip and a status bar — rendered in the light theme and the dark theme, with every surface, stroke, text and Entity colour annotated by its token name and hex value in both themes. A closing note records that the dark values were chosen independently and lists the three pairs that fail their contrast threshold.</desc>
<style>
  text{font-family:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif}
  .fig{font-size:12px;fill:#5A5A5A;letter-spacing:.10em}
  .title{font-family:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-size:20px;font-weight:600;fill:#1B1B1B}
  .sub{font-size:13px;fill:#5A5A5A}
  .cap{font-size:12px;fill:#5A5A5A}
  .ct{font-size:13px;font-weight:600;fill:#1B1B1B}
  .kind{font-size:11px;font-weight:600;fill:#5A5A5A;letter-spacing:.06em}
  .tok{font-family:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;font-size:10.5px;fill:#5A5A5A}
  .tokk{font-family:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;font-size:10.5px;fill:#0F6CBD;font-weight:600}
  .lead{stroke:#0F6CBD;stroke-width:1;fill:none}
  .frame{fill:none;stroke:#C4C4C4;stroke-width:1.5}
  .ann{stroke:#0F6CBD;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
  .fail{fill:#B10E1C;font-size:12px;font-weight:600}
</style>
<rect width="1280" height="900" fill="#F3F3F3"/>
<text class="fig" x="32" y="30">FIGURE 20</text>
<text class="title" x="32" y="58">Light and dark — the same fragment, two independently chosen palettes</text>
<text class="sub" x="32" y="80">Dark is not light inverted. Each value was picked against its own ground and audited on its own terms; three pairs still fail, and are named rather than hidden.</text>

