<!-- ═══════════ token table ═══════════ -->
<text class="kind" x="32" y="510">TOKEN PAIRS — THE SAME NAME, TWO INDEPENDENT VALUES</text>
<rect x="32" y="522" width="1216" height="228" rx="8" fill="#FFFFFF" stroke="#C4C4C4" stroke-width="1.5"/>

<text class="tok" x="52" y="546" font-weight="600" fill="#1B1B1B">TOKEN</text>
<text class="tok" x="300" y="546" font-weight="600" fill="#1B1B1B">LIGHT</text>
<text class="tok" x="430" y="546" font-weight="600" fill="#1B1B1B">DARK</text>
<text class="tok" x="560" y="546" font-weight="600" fill="#1B1B1B">ROLE IN THE FRAGMENT ABOVE</text>
<line x1="52" y1="554" x2="1228" y2="554" stroke="#E1E1E1"/>

<g class="tok">
  <text x="52" y="574">--ground</text>          <rect x="290" y="565" width="12" height="12" fill="#F3F3F3" stroke="#C4C4C4"/><text x="308" y="574">#F3F3F3</text> <rect x="420" y="565" width="12" height="12" fill="#202020" stroke="#565656"/><text x="438" y="574">#202020</text> <text x="560" y="574">the workspace behind the panels</text>
  <text x="52" y="594">--surface</text>         <rect x="290" y="585" width="12" height="12" fill="#FFFFFF" stroke="#C4C4C4"/><text x="308" y="594">#FFFFFF</text> <rect x="420" y="585" width="12" height="12" fill="#2B2B2B" stroke="#565656"/><text x="438" y="594">#2B2B2B</text> <text x="560" y="594">panel body, flyouts, dialogs</text>
  <text x="52" y="614">--surface-alt</text>     <rect x="290" y="605" width="12" height="12" fill="#FAFAFA" stroke="#C4C4C4"/><text x="308" y="614">#FAFAFA</text> <rect x="420" y="605" width="12" height="12" fill="#272727" stroke="#565656"/><text x="438" y="614">#272727</text> <text x="560" y="614">status bar, dock head, table head</text>
  <text x="52" y="634">--canvas</text>          <rect x="290" y="625" width="12" height="12" fill="#F7F7F9" stroke="#C4C4C4"/><text x="308" y="634">#F7F7F9</text> <rect x="420" y="625" width="12" height="12" fill="#17171A" stroke="#565656"/><text x="438" y="634">#17171A</text> <text x="560" y="634">graph ground — deeper than the panels in both themes</text>
  <text x="52" y="654">--canvas-grid</text>     <rect x="290" y="645" width="12" height="12" fill="#E4E4EA" stroke="#C4C4C4"/><text x="308" y="654">#E4E4EA</text> <rect x="420" y="645" width="12" height="12" fill="#27272C" stroke="#565656"/><text x="438" y="654">#27272C</text> <text x="560" y="654">the dot field that makes the canvas read as a workspace</text>
  <text x="52" y="674">--text</text>            <rect x="290" y="665" width="12" height="12" fill="#1B1B1B" stroke="#C4C4C4"/><text x="308" y="674">#1B1B1B</text> <rect x="420" y="665" width="12" height="12" fill="#F5F5F5" stroke="#565656"/><text x="438" y="674">#F5F5F5</text> <text x="560" y="674">15.9:1 light · 13.6:1 dark — both comfortable</text>
  <text x="52" y="694">--text-secondary</text>  <rect x="290" y="685" width="12" height="12" fill="#5A5A5A" stroke="#C4C4C4"/><text x="308" y="694">#5A5A5A</text> <rect x="420" y="685" width="12" height="12" fill="#C2C2C2" stroke="#565656"/><text x="438" y="694">#C2C2C2</text> <text x="560" y="694">7.0:1 light · 8.1:1 dark</text>
  <text x="52" y="714">--accent</text>          <rect x="290" y="705" width="12" height="12" fill="#0F6CBD" stroke="#C4C4C4"/><text x="308" y="714">#0F6CBD</text> <rect x="420" y="705" width="12" height="12" fill="#6CB8F6" stroke="#565656"/><text x="438" y="714">#6CB8F6</text> <text x="560" y="714">a light-theme blue would vanish on #2B2B2B — hence a separate value</text>
  <text x="52" y="734">--e-individual</text>    <rect x="290" y="725" width="12" height="12" fill="#0E7C66" stroke="#C4C4C4"/><text x="308" y="734">#0E7C66</text> <rect x="420" y="725" width="12" height="12" fill="#5FCFB4" stroke="#565656"/><text x="438" y="734">#5FCFB4</text> <text x="560" y="734">every Entity colour is re-picked, never lightened programmatically</text>
</g>

<rect class="ann" x="32" y="766" width="1216" height="64" rx="8"/>
<text class="fail" x="52" y="790">Three pairs fail their threshold and are recorded as defects, not quietly accepted:</text>
<text class="cap" x="52" y="810">--stroke-strong at 1.74:1 light and 1.93:1 dark against --surface, where 3:1 applies because it is the sole boundary of fields and outline buttons and the colour of every graph edge; the SPARQL IRI token at 4.38:1; the comment token at 2.95:1.</text>

<text class="cap" x="32" y="866">Figure 20 · Theme comparison. Illustrates 40-design-system.md, “The complete token catalogue” and “Contrast audit”. [src: the :root and [data-theme="dark"] token blocks, refreshPalette(), setTheme()]</text>
<text class="cap" x="32" y="886">The renderer caches its palette, so a theme change must re-read every cached colour before the next frame; a stale cache shows as a light-theme graph on a dark ground.</text>
</svg>
