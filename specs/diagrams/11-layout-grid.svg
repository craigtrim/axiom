<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 990" width="1280" height="990" role="img" aria-labelledby="fig11-title fig11-desc">
<title id="fig11-title">Figure 11 — Cluster grid layout: type-clustered blocks with frames and titles</title>
<desc id="fig11-desc">Five blocks packed left to right and wrapped into two rows. Each block groups the nodes that share a key — the type of a generated individual, the first parent of a class, or the entity kind — sorted by label and packed into a square-ish grid of thirty-six pixel cells. Every block carries a rounded frame, a title and a count. Dimension brackets mark the cell pitch, the twelve pixel inset, the thirty-six pixel title band, the forty pixel gap between blocks and the forty-eight pixel gap between rows.</desc>
