<text class="dim" x="132" y="218">CELL_G = 36</text>
<path class="dl" d="M60 396 L60 388 M72 396 L72 388 M60 392 L72 392"/>
<text class="dim" x="78" y="396">12 inset</text>
<path class="dl" d="M52 180 L44 180 M52 216 L44 216 M48 180 L48 216"/>
<text class="dim" x="36" y="200" text-anchor="end">36</text>
<path class="dl" d="M408 172 L408 164 M448 172 L448 164 M408 168 L448 168"/>
<text class="dim" x="428" y="160" text-anchor="middle">40 between blocks</text>
<path class="dl" d="M52 406 L44 406 M52 454 L44 454 M48 406 L48 454"/>
<text class="dim" x="36" y="434" text-anchor="end">48</text>
<path class="dl" d="M644 490 L662 490 L662 470"/>
<text class="dim" x="672" y="494">count sits 46 past the title,</text>
<text class="dim" x="672" y="510">so on a narrow block it falls</text>
<text class="dim" x="672" y="526">outside the frame — by design</text>
<path class="dl" d="M724 384 L740 384"/>
<text class="dim" x="746" y="388">targetW = 703 forced the wrap</text>

<text class="lab" x="60" y="656">BLOCK ORDER IS DESCENDING NODE COUNT — 40, 24, 12, 6, 3 — SO THE LARGEST CLUSTER ANCHORS THE TOP-LEFT AND THE PACKING DEGRADES GRACEFULLY</text>
<text class="lab" x="60" y="676">NODES WITHIN A BLOCK ARE SORTED BY LABEL, SO THE SAME VIEW ALWAYS PRODUCES THE SAME GRID</text>

<rect class="card" x="848" y="104" width="400" height="200" rx="8"/>
<text class="h" x="868" y="132">The grouping key</text>
<text class="mns" x="868" y="154">keyOf(n), in order:</text>
<text class="mn" x="868" y="176">1  store.indIndex.get(iri) → rec.type</text>
<text class="mn" x="868" y="194">2  kind === individual → demo:Customer</text>
<text class="mn" x="868" y="212">3  entity.parents[0]</text>
<text class="mn" x="868" y="230">4  'kind:' + n.kind</text>
<text class="ps" x="868" y="254">A generated order clusters by its pizza type; a class</text>
<text class="ps" x="868" y="272">clusters under its parent; anything left clusters by</text>
<text class="ps" x="868" y="290">kind, and takes its title from KIND_META.</text>

<rect class="card" x="848" y="320" width="400" height="210" rx="8"/>
<text class="h" x="868" y="348">Block geometry</text>
<text class="mn" x="868" y="372">cols = max(1, ceil(sqrt(n × 1.8)))</text>
<text class="mn" x="868" y="390">rows = ceil(n / cols)</text>
<text class="mn" x="868" y="408">w = cols × 36 + 24 · h = rows × 36 + 46</text>
<text class="ps" x="868" y="432">The 1.8 factor makes a block wider than tall, which</text>
<text class="ps" x="868" y="450">reads better in a landscape viewport than a square.</text>
<text class="mns" x="868" y="474">40 nodes → cols 9, rows 5, 348 × 226</text>
<text class="mns" x="868" y="492">24 nodes → cols 7, rows 4, 276 × 190</text>
<text class="mns" x="868" y="510">3 nodes  → cols 3, rows 1, 132 × 82</text>

<rect class="card" x="848" y="546" width="400" height="188" rx="8"/>
<text class="h" x="868" y="574">Packing the blocks</text>
<text class="mn" x="868" y="598">targetW = max(700, sqrt(Σ w×h) × 1.6)</text>
<text class="ps" x="868" y="622">The target width follows the total area, so a view with</text>
<text class="ps" x="868" y="640">one huge block does not become a single endless row.</text>
<text class="mns" x="868" y="664">Σ area = 193,152 → sqrt = 439 → targetW = 703</text>
<text class="ps" x="868" y="688">Blocks flow left to right; a block that would cross</text>
<text class="ps" x="868" y="706">targetW starts a new row 48 below the tallest block</text>
<text class="ps" x="868" y="724">in the row it just left.</text>

<rect class="card" x="848" y="750" width="400" height="178" rx="8"/>
<text class="h" x="868" y="778">Frames and titles</text>
<text class="ps" x="868" y="800">Frames are drawn in world space with roundRect radius 10</text>
<text class="ps" x="868" y="818">and the --stroke token, so they scale with the zoom.</text>
<text class="ps" x="868" y="840">Titles are drawn in screen space at a fixed 12px, offset</text>
<text class="ps" x="868" y="858">(+12, +22) from the block origin, and suppressed entirely</text>
<text class="ps" x="868" y="876">below 22% zoom where they would be unreadable anyway.</text>
<text class="mns" x="868" y="900">G.groupBlocks holds x, y, w, h, label and count after</text>
<text class="mns" x="868" y="918">centreNodes() has shifted everything.</text>

<rect class="card" x="32" y="716" width="800" height="212" rx="8"/>
<text class="h" x="52" y="744">Why alignment beats relaxation here</text>
<text class="p" x="52" y="770">chooseLayout() reaches grid on two tests: more than 300 nodes where over 55% of the edges are rdf:type,</text>
<text class="p" x="52" y="788">or more than 500 nodes regardless of shape. Both describe the same situation — a wall of instances.</text>
<text class="ps" x="52" y="816">A force simulation over a thousand instances of one class produces a disc. Every node has the same degree,</text>
<text class="ps" x="52" y="834">the same single edge to the same parent, and the same charge, so the simulation has no information to</text>
<text class="ps" x="52" y="852">separate them with. The result costs a second of CPU and tells the reader nothing they did not already know.</text>
<text class="ps" x="52" y="878">A grid tells them the count at a glance, groups by type without a legend, sorts by label so a specific row</text>
<text class="ps" x="52" y="896">can be found by eye, and is deterministic — the same query always lands the same node in the same cell.</text>
<text class="mns" x="52" y="918">Velocities are zeroed and the layout is computed once, so the freeze control is disabled and says why.</text>

<text class="cap" x="32" y="962">Figure 11 · Cluster grid layout. Illustrates 21-layout-algorithms.md, “Cluster grid”, and 20-graph-viewport-and-budget.md, “Layout selection”. [src: layoutGrid(), chooseLayout(), renderScene() group pass]</text>
</svg>
