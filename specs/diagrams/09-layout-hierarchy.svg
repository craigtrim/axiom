<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1120" width="1280" height="1120" role="img" aria-labelledby="fig9-title fig9-desc">
<title id="fig9-title">Figure 9 — The four Sugiyama phases over one class hierarchy</title>
<desc id="fig9-desc">Four panels over the same ten-node hierarchy. Panel one assigns layers by longest path. Panel two orders each layer by a depth-first traversal from the roots. Panel three runs the median heuristic over a disturbed row, showing the median key for each node and the re-sorted result with its crossings removed. Panel four packs each row by label width and then relaxes the coordinates toward the neighbour means, clamped by the immediate left and right neighbours.</desc>
