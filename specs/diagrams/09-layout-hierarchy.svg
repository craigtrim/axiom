<text class="fig" x="32" y="30">FIGURE 9</text>
<text class="title" x="32" y="58">Hierarchy layout — Sugiyama in four phases</text>
<text class="sub" x="32" y="80">The same ten-node view throughout: Pizza and Pizza Topping with their subclasses, and one generated order typed pizza:Margherita. Only subClassOf, subPropertyOf and rdf:type edges take part.</text>

