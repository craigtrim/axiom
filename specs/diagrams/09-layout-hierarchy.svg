<text class="badge" x="967" y="260">3</text>
<rect class="box" x="1014" y="245" width="84" height="22" rx="4"/><rect x="1014" y="245" width="3" height="22" fill="#0F6CBD"/><text class="nd" x="1057" y="260">Named Pizza</text>
<text class="badge" x="1110" y="260">6</text>

<rect class="box" x="677" y="305" width="78" height="22" rx="4"/><rect x="677" y="305" width="3" height="22" fill="#0F6CBD"/><text class="nd" x="717" y="320">Mozzarella</text>
<text class="badge" x="765" y="320">2</text>
<rect class="box" x="785" y="305" width="103" height="22" rx="4"/><rect x="785" y="305" width="3" height="22" fill="#0F6CBD"/><text class="nd" x="837" y="320">Tomato Topping</text>
<text class="badge" x="898" y="320">4</text>
<rect class="box" x="928" y="305" width="78" height="22" rx="4"/><rect x="928" y="305" width="3" height="22" fill="#0F6CBD"/><text class="nd" x="968" y="320">Margherita</text>
<text class="badge" x="1016" y="320">7</text>
<rect class="box" x="1034" y="305" width="66" height="22" rx="4"/><rect x="1034" y="305" width="3" height="22" fill="#0F6CBD"/><text class="nd" x="1068" y="320">Mushroom</text>
<text class="badge" x="1110" y="320">9</text>

<rect class="box" x="931" y="365" width="72" height="22" rx="4"/><rect x="931" y="365" width="3" height="22" fill="#0E7C66"/><text class="nd" x="968" y="380">AX-100042</text>
<text class="badge" x="1013" y="380">8</text>

<rect class="inner" x="668" y="404" width="560" height="144" rx="4"/>
<text class="mn" x="682" y="424">for (const n of nodes) stack.push(n.iri);</text>
<text class="mn" x="682" y="440">for (const n of rows[0]) stack.push(n.iri);   /* roots pop first */</text>
<text class="ps" x="682" y="462">Every node is pushed, then the roots are pushed again on top, so the traversal always</text>
<text class="ps" x="682" y="480">starts at a root and still reaches anything the roots cannot — in reverse admission order.</text>
<text class="ps" x="682" y="498">Children are pushed in descending name order so they pop in ascending order.</text>
<text class="ps" x="682" y="520">Rows are then sorted by DFS index, which makes each subtree contiguous. For a</text>
<text class="ps" x="682" y="538">single-parent hierarchy this initial order is already crossing-free.</text>

<!-- PANEL 3 -->
<rect class="panel" x="32" y="580" width="600" height="460" rx="8"/>
<text class="ph" x="52" y="610">Phase 3 — crossing reduction</text>
<text class="phs" x="52" y="630">Median heuristic, eight passes alternating upward and downward. Skipped entirely if any row exceeds 260 nodes.</text>

<text class="lab" x="52" y="656">BEFORE — A ROW WHOSE ORDER HAS BEEN DISTURBED · 3 CROSSINGS</text>
<rect class="box" x="58" y="666" width="104" height="22" rx="4"/><text class="nd" x="110" y="681">Cheese Topping</text>
<rect class="box" x="219" y="666" width="122" height="22" rx="4"/><text class="nd" x="281" y="681">Vegetable Topping</text>
<rect class="box" x="398" y="666" width="84" height="22" rx="4"/><text class="nd" x="441" y="681">Named Pizza</text>
<rect class="box" x="61" y="726" width="78" height="22" rx="4"/><text class="nd" x="101" y="741">Margherita</text>
<rect class="box" x="177" y="726" width="78" height="22" rx="4"/><text class="nd" x="217" y="741">Mozzarella</text>
<rect class="box" x="289" y="726" width="66" height="22" rx="4"/><text class="nd" x="323" y="741">Mushroom</text>
<rect class="box" x="399" y="726" width="103" height="22" rx="4"/><text class="nd" x="451" y="741">Tomato Topping</text>
<path class="edx" d="M101 726 L101 707 L441 707 L441 688"/>
<path class="ed" d="M217 726 L217 707 L110 707 L110 688"/>
<path class="edx" d="M323 726 L323 707 L441 707 L441 688"/>
<path class="edx" d="M451 726 L451 707 L281 707 L281 688"/>
<text class="mns" x="510" y="681">positions 0, 1, 2</text>
<text class="mns" x="516" y="741">parent → 2, 0, 2, 1</text>

<rect class="inner" x="52" y="762" width="560" height="76" rx="4"/>
<text class="mn" x="66" y="782">median(u, up) — the median position of u's parents in the row above; −1 keeps index i</text>
<text class="mn" x="66" y="800">Margherita → 2 · Mozzarella → 0 · Mushroom → 2 · Tomato Topping → 1</text>
<text class="mns" x="66" y="820">r.sort((a, b) =&gt; (key[a] − key[b]) || (pos[a] − pos[b]))   — ties keep their previous order</text>

<text class="lab" x="52" y="862">AFTER — ONE PASS · 0 CROSSINGS</text>
<rect class="box" x="58" y="872" width="104" height="22" rx="4"/><text class="nd" x="110" y="887">Cheese Topping</text>
<rect class="box" x="219" y="872" width="122" height="22" rx="4"/><text class="nd" x="281" y="887">Vegetable Topping</text>
<rect class="box" x="398" y="872" width="84" height="22" rx="4"/><text class="nd" x="441" y="887">Named Pizza</text>
<rect class="box" x="61" y="932" width="78" height="22" rx="4"/><text class="nd" x="101" y="947">Mozzarella</text>
<rect class="box" x="177" y="932" width="103" height="22" rx="4"/><text class="nd" x="229" y="947">Tomato Topping</text>
<rect class="box" x="330" y="932" width="78" height="22" rx="4"/><text class="nd" x="370" y="947">Margherita</text>
<rect class="box" x="438" y="932" width="66" height="22" rx="4"/><text class="nd" x="472" y="947">Mushroom</text>
<path class="ed" d="M101 932 L101 913 L110 913 L110 894"/>
<path class="ed" d="M229 932 L229 913 L281 913 L281 894"/>
<path class="ed" d="M370 932 L370 913 L441 913 L441 894"/>
<path class="ed" d="M472 932 L472 913 L441 913 L441 894"/>
<text class="ok" x="520" y="947">order restored</text>
<text class="ps" x="52" y="988">The comparator only ever sees hierarchy edges. Restriction and domain-range edges are drawn but never</text>
<text class="ps" x="52" y="1006">optimised, and no dummy vertices are inserted, so a route that jogs across a row is a route, not a node.</text>
<text class="ps" x="52" y="1024">The pass is a safeguard: when the DFS order is already clean, eight passes confirm it and change nothing.</text>

<!-- PANEL 4 -->
<rect class="panel" x="648" y="580" width="600" height="460" rx="8"/>
<text class="ph" x="668" y="610">Phase 4 — coordinate relaxation</text>
<text class="phs" x="668" y="630">Pack each row by label width, centre it, then twelve passes of median-seeking with a hard neighbour clamp.</text>

<text class="lab" x="668" y="656">PACKED — widthOf(n) = min(200, max(2r + 18, label.length × 6.8 + 16)) · gapX = 20</text>
<rect class="box" x="674" y="666" width="104" height="22" rx="4"/><text class="nd" x="726" y="681">Cheese Topping</text>
<rect class="box" x="798" y="666" width="122" height="22" rx="4"/><text class="nd" x="859" y="681">Vegetable Topping</text>
<rect class="box" x="940" y="666" width="84" height="22" rx="4"/><text class="nd" x="982" y="681">Named Pizza</text>
<rect class="box" x="674" y="726" width="78" height="22" rx="4"/><text class="nd" x="713" y="741">Mozzarella</text>
<rect class="box" x="772" y="726" width="103" height="22" rx="4"/><text class="nd" x="823" y="741">Tomato Topping</text>
<rect class="box" x="895" y="726" width="78" height="22" rx="4"/><text class="nd" x="934" y="741">Margherita</text>
<rect class="box" x="993" y="726" width="66" height="22" rx="4"/><text class="nd" x="1026" y="741">Mushroom</text>
<path class="ed" d="M713 726 L713 707 L726 707 L726 688"/>
<path class="ed" d="M823 726 L823 707 L859 707 L859 688"/>
<path class="ed" d="M934 726 L934 707 L982 707 L982 688"/>
<path class="ed" d="M1026 726 L1026 707 L982 707 L982 688"/>
<text class="mns" x="1074" y="681">rows are centred</text>
<text class="mns" x="1074" y="741">on x = 0 after packing</text>

<rect class="inner" x="668" y="762" width="560" height="118" rx="4"/>
<text class="lab" x="682" y="782">ONE NODE, ONE PASS — Margherita seeking its parent’s x</text>
<path class="brk" d="M760 800 L760 830"/>
<path class="brk" d="M1140 800 L1140 830"/>
<path class="brk" d="M760 815 L1140 815"/>
<text class="mns" x="766" y="798">lo = left.x + left.w/2 + gapX + n.w/2</text>
<text class="mns" x="1134" y="798" text-anchor="end">hi = right.x − right.w/2 − gapX − n.w/2</text>
<circle cx="880" cy="815" r="5" fill="#C4C4C4"/><text class="mns" x="856" y="846">n.x now</text>
<circle cx="1010" cy="815" r="5" fill="#0F6CBD"/><text class="mns" x="978" y="846">want (clamped)</text>
<path class="brk" d="M886 815 L1000 815" marker-end="none"/>
<circle cx="952" cy="815" r="5" fill="#0F6CBD" fill-opacity="0.35"/>
<text class="mns" x="906" y="866">n.x += (want − n.x) × 0.55 — 55% of the way, every pass</text>

<text class="ps" x="668" y="904">Within a row the nodes are relaxed in descending in-view degree, so the best-connected node claims its</text>
<text class="ps" x="668" y="922">position first and the rest settle around it. If lo &gt; hi the row is already tight and the node does not move.</text>
<text class="ps" x="668" y="940">Passes alternate: even passes seek the mean of the parents, odd passes the mean of the children.</text>
<text class="mn" x="668" y="966">rows.forEach((r, i) =&gt; { for (const n of r) { n.y = i * 124; n.vx = 0; n.vy = 0; } });</text>
<text class="ps" x="668" y="990">gapY is a constant 124, so layer depth reads at a glance and the whole figure is then centred by</text>
<text class="ps" x="668" y="1008">centreNodes(). Velocities are zeroed: a hierarchy layout is computed once, never simulated.</text>

<text class="cap" x="32" y="1076">Figure 9 · Hierarchy layout. Illustrates 21-layout-algorithms.md, “Hierarchy (Sugiyama)”. [src: layoutHierarchy()]</text>
<text class="cap" x="32" y="1096">Phases 1 and 2 are always executed; phase 3 is skipped when a row exceeds 260 nodes; phase 4 always runs. The result is deterministic — the same view always lays out identically.</text>
</svg>
