<rect class="box" x="429" y="305" width="103" height="22" rx="4"/><rect x="429" y="305" width="3" height="22" fill="#0F6CBD"/><text class="nd" x="481" y="320">Tomato Topping</text>
<text class="lay" x="560" y="350">layer 2</text>

<rect class="box" x="74" y="365" width="72" height="22" rx="4"/><rect x="74" y="365" width="3" height="22" fill="#0E7C66"/><text class="nd" x="111" y="380">AX-100042</text>
<text class="lay" x="560" y="380">layer 3</text>
<text class="mns" x="160" y="380">rdf:type is a layering edge, so an instance sits under its class</text>

<rect class="inner" x="52" y="404" width="560" height="144" rx="4"/>
<text class="mn" x="66" y="424">const depthOf = (u) =&gt; { if (layer.has(u)) return layer.get(u);</text>
<text class="mn" x="66" y="440">  if (mark.get(u) === 1) return 0; … }</text>
<text class="ps" x="66" y="462">The mark guard makes a cycle terminate at depth 0 rather than recurse forever.</text>
<text class="ps" x="66" y="480">A node with no hierarchy edge at all is not left at layer 0: it is placed one row</text>
<text class="ps" x="66" y="498">under the deepest neighbour it has by any predicate — property nodes land near</text>
<text class="ps" x="66" y="516">the classes they relate rather than floating along the top edge.</text>
<text class="ps" x="66" y="538">Each node has at most one hierarchy parent here, so every edge spans exactly one layer.</text>

