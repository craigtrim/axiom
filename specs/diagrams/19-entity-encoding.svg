<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" role="img" aria-labelledby="fig19-title fig19-desc">
<title id="fig19-title">Figure 19 — Entity encoding and node decoration</title>
<desc id="fig19-desc">The five Entity kinds shown as their shapes at four degrees, with the radius formula and its computed values; then the decoration layer — the defined-class mark, the focus ring, the pin marker, the selection ring and the hidden-neighbour badge — each shown applied to a node and described.</desc>
<style>
  text{font-family:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif}
  .fig{font-size:12px;fill:#5A5A5A;letter-spacing:.10em}
  .title{font-family:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-size:20px;font-weight:600;fill:#1B1B1B}
  .sub{font-size:13px;fill:#5A5A5A}
  .cap{font-size:12px;fill:#5A5A5A}
  .ct{font-size:13px;font-weight:600;fill:#1B1B1B}
  .kind{font-size:11px;font-weight:600;fill:#5A5A5A;letter-spacing:.06em}
  .lbl{font-size:11px;fill:#1B1B1B;font-weight:600}
  .mn{font-family:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;font-size:11px;fill:#1B1B1B}
  .mns{font-family:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;font-size:11px;fill:#5A5A5A}
  .col{fill:#FFFFFF;stroke:#E1E1E1;stroke-width:1}
  .card{fill:#FFFFFF;stroke:#C4C4C4;stroke-width:1.5}
  .canvas{fill:#F7F7F9}
  .ann{stroke:#0F6CBD;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
</style>
<rect width="1280" height="880" fill="#F3F3F3"/>
<text class="fig" x="32" y="30">FIGURE 19</text>
<text class="title" x="32" y="58">Entity encoding — shape carries the meaning, colour reinforces it</text>
<text class="sub" x="32" y="80">Kind is legible in greyscale and to a colour-blind reader. Every decoration is additive and never replaces the base shape.</text>

<!-- ───────── kind × degree matrix ───────── -->
<rect class="canvas" x="32" y="104" width="800" height="360" rx="8"/>
<rect x="32" y="104" width="800" height="360" rx="8" fill="none" stroke="#C4C4C4" stroke-width="1.5"/>

<text class="kind" x="52" y="132">KIND</text>
<text class="kind" x="300" y="132" text-anchor="middle">deg 0</text>
<text class="kind" x="430" y="132" text-anchor="middle">deg 3</text>
<text class="kind" x="560" y="132" text-anchor="middle">deg 10</text>
<text class="kind" x="690" y="132" text-anchor="middle">deg ≥ 100</text>
<text class="kind" x="790" y="132" text-anchor="middle">r</text>
<line x1="52" y1="142" x2="812" y2="142" stroke="#E1E1E1"/>

<!-- class -->
<g>
  <text class="ct" x="52" y="182">Class</text>
  <text class="mns" x="52" y="198">rounded square</text>
  <rect x="292" y="170" width="16" height="16" rx="4" fill="#0F6CBD"/>
  <rect x="419" y="159" width="22" height="22" rx="5" fill="#0F6CBD"/>
  <rect x="547" y="157" width="26" height="26" rx="6" fill="#0F6CBD"/>
  <rect x="674" y="154" width="32" height="32" rx="7" fill="#0F6CBD"/>
  <text class="mns" x="790" y="174" text-anchor="middle">8.5</text>
  <text class="mns" x="790" y="188" text-anchor="middle">→17.5</text>
  <line x1="52" y1="212" x2="812" y2="212" stroke="#EAEAEA"/>
</g>
<!-- defined class -->
<g>
  <text class="ct" x="52" y="252">Defined class</text>
  <text class="mns" x="52" y="268">rounded square + cross</text>
  <rect x="292" y="240" width="16" height="16" rx="4" fill="#B36A00"/>
  <path d="M296.8 248 h6.4 M300 244.8 v6.4" stroke="#F7F7F9" stroke-width="2"/>
  <rect x="419" y="229" width="22" height="22" rx="5" fill="#B36A00"/>
  <path d="M425.6 240 h8.8 M430 235.6 v8.8" stroke="#F7F7F9" stroke-width="2"/>
  <rect x="547" y="227" width="26" height="26" rx="6" fill="#B36A00"/>
  <path d="M554.8 240 h10.4 M560 234.8 v10.4" stroke="#F7F7F9" stroke-width="2"/>
  <rect x="674" y="224" width="32" height="32" rx="7" fill="#B36A00"/>
  <path d="M683 240 h14 M690 233 v14" stroke="#F7F7F9" stroke-width="2"/>
  <text class="mns" x="790" y="244" text-anchor="middle">8.5</text>
  <text class="mns" x="790" y="258" text-anchor="middle">→17.5</text>
  <line x1="52" y1="282" x2="812" y2="282" stroke="#EAEAEA"/>
</g>
<!-- individual -->
<g>
  <text class="ct" x="52" y="322">Individual</text>
  <text class="mns" x="52" y="338">circle</text>
  <circle cx="300" cy="315" r="5.5" fill="#0E7C66"/>
  <circle cx="430" cy="315" r="8.7" fill="#0E7C66"/>
  <circle cx="560" cy="315" r="11" fill="#0E7C66"/>
  <circle cx="690" cy="315" r="14.5" fill="#0E7C66"/>
  <text class="mns" x="790" y="314" text-anchor="middle">5.5</text>
  <text class="mns" x="790" y="328" text-anchor="middle">→14.5</text>
  <line x1="52" y1="352" x2="812" y2="352" stroke="#EAEAEA"/>
</g>
<!-- object property -->
<g>
  <text class="ct" x="52" y="392">Object property</text>
  <text class="mns" x="52" y="408">diamond</text>
  <path d="M300 378 l7 7 l-7 7 l-7 -7 z" fill="#7A46C0"/>
  <path d="M430 375 l10.2 10 l-10.2 10 l-10.2 -10 z" fill="#7A46C0"/>
  <path d="M560 372.5 l12.5 12.5 l-12.5 12.5 l-12.5 -12.5 z" fill="#7A46C0"/>
  <path d="M690 369 l16 16 l-16 16 l-16 -16 z" fill="#7A46C0"/>
  <text class="mns" x="790" y="384" text-anchor="middle">7.0</text>
  <text class="mns" x="790" y="398" text-anchor="middle">→16.0</text>
  <line x1="52" y1="422" x2="812" y2="422" stroke="#EAEAEA"/>
</g>
<!-- data property -->
<g>
  <text class="ct" x="52" y="452">Data property</text>
  <text class="mns" x="52" y="468">hexagon</text>
  <path d="M306.1 451.5 l0 -7 l-6.1 -3.5 l-6.1 3.5 l0 7 l6.1 3.5 z" fill="#A8446F"/>
  <path d="M438.8 453 l0 -10.2 l-8.8 -5.1 l-8.8 5.1 l0 10.2 l8.8 5.1 z" fill="#A8446F"/>
  <path d="M570.9 454 l0 -12.5 l-10.9 -6.3 l-10.9 6.3 l0 12.5 l10.9 6.3 z" fill="#A8446F"/>
  <path d="M703.9 456 l0 -16 l-13.9 -8 l-13.9 8 l0 16 l13.9 8 z" fill="#A8446F"/>
  <text class="mns" x="790" y="444" text-anchor="middle">7.0</text>
  <text class="mns" x="790" y="458" text-anchor="middle">→16.0</text>
</g>

<!-- radius formula -->
<rect class="card" x="864" y="104" width="384" height="152" rx="8"/>
<text class="kind" x="880" y="128">RADIUS</text>
<text class="mn" x="880" y="152">r = base + min(9, log2(1 + deg) × 1.6)</text>
<text class="mns" x="880" y="178">base  5.5  Individual</text>
<text class="mns" x="880" y="194">      7.0  Object / data property</text>
<text class="mns" x="880" y="210">      8.5  Class / defined class</text>
<text class="cap" x="880" y="234">Base is the floor; the logarithmic term is the earned</text>
<text class="cap" x="880" y="250">size, and it stops at +9 whatever the degree.</text>

<!-- ───────── decoration layer ───────── -->
<rect class="canvas" x="864" y="280" width="384" height="184" rx="8"/>
<rect x="864" y="280" width="384" height="184" rx="8" fill="none" stroke="#C4C4C4" stroke-width="1.5"/>
<text class="kind" x="880" y="304">SIZE IS CAPPED, NOT UNBOUNDED</text>
<text class="cap" x="880" y="326">A class with 4,550 instances draws at the same radius</text>
<text class="cap" x="880" y="342">as one with 100. Degree earns size only up to log2 of</text>
<text class="cap" x="880" y="358">roughly 50 neighbours, after which the badge carries</text>
<text class="cap" x="880" y="374">the magnitude instead. Without the cap a single hub</text>
<text class="cap" x="880" y="390">would dominate the drawing and the collision pass</text>
<text class="cap" x="880" y="406">would push everything else off screen.</text>
<text class="cap" x="880" y="430">The badge is the honest channel for scale; the shape</text>
<text class="cap" x="880" y="446">is the honest channel for kind.</text>

<!-- decorations -->
<rect class="canvas" x="32" y="496" width="1216" height="230" rx="8"/>
<rect x="32" y="496" width="1216" height="230" rx="8" fill="none" stroke="#C4C4C4" stroke-width="1.5"/>
<text class="kind" x="52" y="522">DECORATION LAYER — ADDITIVE, NEVER SUBSTITUTIVE</text>

<g>
  <rect x="110" y="566" width="26" height="26" rx="6" fill="#0F6CBD"/>
  <text class="lbl" x="123" y="620" text-anchor="middle">Base</text>
  <text class="cap" x="123" y="638" text-anchor="middle">shape + colour</text>
  <text class="cap" x="123" y="654" text-anchor="middle">only</text>
</g>
<g>
  <rect x="278" y="566" width="26" height="26" rx="6" fill="#B36A00"/>
  <path d="M285.8 579 h10.4 M291 573.8 v10.4" stroke="#F7F7F9" stroke-width="2"/>
  <text class="lbl" x="291" y="620" text-anchor="middle">Defined mark</text>
  <text class="cap" x="291" y="638" text-anchor="middle">cross in canvas</text>
  <text class="cap" x="291" y="654" text-anchor="middle">colour, 2px</text>
</g>
<g>
  <rect x="446" y="566" width="26" height="26" rx="6" fill="#0F6CBD"/>
  <rect x="443" y="563" width="32" height="32" rx="7" fill="none" stroke="#1B1B1B" stroke-width="1.8"/>
  <text class="lbl" x="459" y="620" text-anchor="middle">Focus ring</text>
  <text class="cap" x="459" y="638" text-anchor="middle">kind path, +3px,</text>
  <text class="cap" x="459" y="654" text-anchor="middle">text colour</text>
</g>
<g>
  <rect x="614" y="566" width="26" height="26" rx="6" fill="#0F6CBD"/>
  <circle cx="616" cy="568" r="4.4" fill="#8A5200"/>
  <text class="lbl" x="627" y="620" text-anchor="middle">Pin</text>
  <text class="cap" x="627" y="638" text-anchor="middle">warn dot at the</text>
  <text class="cap" x="627" y="654" text-anchor="middle">upper-left</text>
</g>
<g>
  <rect x="782" y="566" width="26" height="26" rx="6" fill="#0F6CBD"/>
  <circle cx="795" cy="579" r="20" fill="none" stroke="#0F6CBD" stroke-width="2.5"/>
  <text class="lbl" x="795" y="620" text-anchor="middle">Selection</text>
  <text class="cap" x="795" y="638" text-anchor="middle">accent circle,</text>
  <text class="cap" x="795" y="654" text-anchor="middle">r + 7px</text>
</g>
<g>
  <rect x="950" y="566" width="26" height="26" rx="6" fill="#0F6CBD"/>
  <rect x="967" y="552" width="34" height="14" rx="7" fill="#FFFFFF" stroke="#C4C4C4"/>
  <text x="984" y="562" font-size="9.5" font-weight="600" fill="#5A5A5A" text-anchor="middle">+4.5k</text>
  <text class="lbl" x="972" y="620" text-anchor="middle">Hidden badge</text>
  <text class="cap" x="972" y="638" text-anchor="middle">deg − shownDeg,</text>
  <text class="cap" x="972" y="654" text-anchor="middle">abbreviated at 1k</text>
</g>
<g>
  <rect x="1118" y="566" width="26" height="26" rx="6" fill="#0F6CBD"/>
  <rect x="1115" y="563" width="32" height="32" rx="7" fill="none" stroke="#1B1B1B" stroke-width="1.8"/>
  <circle cx="1120" cy="568" r="4.4" fill="#8A5200"/>
  <rect x="1135" y="552" width="30" height="14" rx="7" fill="#FFFFFF" stroke="#C4C4C4"/>
  <text x="1150" y="562" font-size="9.5" font-weight="600" fill="#5A5A5A" text-anchor="middle">+12</text>
  <text class="lbl" x="1140" y="620" text-anchor="middle">Combined</text>
  <text class="cap" x="1140" y="638" text-anchor="middle">decorations stack</text>
  <text class="cap" x="1140" y="654" text-anchor="middle">without conflict</text>
</g>

<rect class="ann" x="52" y="672" width="1176" height="40" rx="6"/>
<text class="cap" x="68" y="697">Badges are drawn in screen space at a fixed 9.5px, so they stay readable at any zoom — and they are suppressed below 0.3× zoom, where the node itself is too small to anchor them.</text>

<text class="cap" x="32" y="772">Figure 19 · Entity encoding. Illustrates 40-design-system.md, “Entity visual encoding”, and 22-graph-rendering-and-export.md, “Node rendering”. [src: KIND_META, nodeRadius(), nodePath(), nodeColour(), hiddenNeighbours(), renderScene()]</text>
<text class="cap" x="32" y="792">Radii are drawn to scale against the stated values. The deg ≥ 100 column is the ceiling: every degree above roughly 50 produces the same radius.</text>
<text class="cap" x="32" y="812">The five colours are drawn from the Entity token group and are chosen to remain distinguishable under the common colour-vision deficiencies; the shapes make that a reinforcement rather than a dependency.</text>
<text class="cap" x="32" y="832">In the dark theme every fill switches to its independently chosen dark value while the shapes are unchanged — see Figure 20.</text>
</svg>
