<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="1280" height="960" role="img" aria-labelledby="fig13-title fig13-desc">
<title id="fig13-title">Figure 13 — The greedy label collision pass</title>
<desc id="fig13-desc">Ten nodes with their candidate labels. Labels are placed in descending priority order; each accepted label reserves a rectangle and any later candidate whose rectangle overlaps a reserved one is dropped rather than drawn. Two labels are dropped here. A table on the right gives every candidate's priority arithmetic and its outcome, and panels below describe the spatial hash used for the overlap test and the culling and truncation rules.</desc>
