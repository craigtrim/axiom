<rect class="inner" x="684" y="544" width="544" height="102" rx="4"/>
<text class="ps" x="698" y="566">Ties keep their sort order, so equal candidates resolve deterministically — the same view</text>
<text class="ps" x="698" y="584">always drops the same labels, which matters for an export a reader will compare against another.</text>
<text class="ps" x="698" y="608">Mozzarella loses to Margherita on the third term alone: identical state, identical radius, and</text>
<text class="ps" x="698" y="626">one fewer in-view edge. AX-100043 loses to AX-100042 on position in the sorted array.</text>

<rect class="card" x="32" y="680" width="616" height="212" rx="8"/>
<text class="h" x="52" y="708">The overlap test — a 96px spatial hash</text>
<rect class="bk" x="52" y="724" width="96" height="48"/>
<rect class="bk" x="148" y="724" width="96" height="48"/>
<rect class="bk" x="244" y="724" width="96" height="48"/>
<rect class="bk" x="52" y="772" width="96" height="48"/>
<rect class="bk" x="148" y="772" width="96" height="48"/>
<rect class="bk" x="244" y="772" width="96" height="48"/>
<rect class="keep" x="110" y="756" width="90" height="16" rx="2"/>
<text class="mns" x="356" y="742">B = 96</text>
<text class="ps" x="356" y="764">A rectangle is registered in every bucket it touches —</text>
<text class="ps" x="356" y="782">the one above spans two — and a candidate is tested</text>
<text class="ps" x="356" y="800">only against the rectangles in the buckets it would</text>
<text class="ps" x="356" y="818">occupy. Cost is proportional to local density, not to</text>
<text class="ps" x="356" y="836">the number of labels already placed.</text>
<text class="mns" x="52" y="860">if (r.x &lt; q.x + q.w &amp;&amp; r.x + r.w &gt; q.x &amp;&amp; r.y &lt; q.y + q.h &amp;&amp; r.y + r.h &gt; q.y) return true;</text>
<text class="ps" x="52" y="880">Plain axis-aligned rectangle intersection. No padding beyond the 3px and 2px already baked into the rect.</text>

<rect class="card" x="664" y="680" width="584" height="212" rx="8"/>
<text class="h" x="684" y="708">Culling, truncation and the cap</text>
<text class="mns" x="684" y="732">if (sx &lt; −240 || sy &lt; −40 || sx &gt; o.w + 240 || sy &gt; o.h + 40) continue;</text>
<text class="ps" x="684" y="752">The horizontal margin is wide because a label is centred on its node and a long one can reach</text>
<text class="ps" x="684" y="770">well past it; the vertical margin is narrow because a label is only ever 16px tall.</text>
<text class="mns" x="684" y="794">n.label.length &gt; 30 ? n.label.slice(0, 28) + '…' : n.label</text>
<text class="ps" x="684" y="814">Truncation happens before measuring, so an over-long IRI local name cannot monopolise a row.</text>
<text class="mns" x="684" y="838">maxLabels: 900 on screen · 4,000 in an export</text>
<text class="ps" x="684" y="858">The loop breaks at the cap, so the cost of a dense view is bounded even before the collision</text>
<text class="ps" x="684" y="876">test. The highest-priority 900 are the ones that survive, which is the right 900.</text>

<text class="cap" x="32" y="922">Figure 13 · Label placement. Illustrates 22-graph-rendering-and-export.md, “Label collision pass”. [src: placeLabels(), shortLabel(), labelFont()]</text>
<text class="cap" x="32" y="942">Why the result stays legible: every drawn label is at its designed point size, has a 3.5px halo in the background colour, and is guaranteed not to touch another. Density costs coverage, never clarity.</text>
</svg>
