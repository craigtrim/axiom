<text class="fig" x="32" y="30">FIGURE 13</text>
<text class="title" x="32" y="58">Label placement — highest priority wins the space, the rest are simply not drawn</text>
<text class="sub" x="32" y="80">Ten candidates, eight accepted, two dropped. Nothing is shrunk, nudged or leadered: a label that cannot be placed legibly is omitted, and zooming in reveals it.</text>

