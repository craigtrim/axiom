<text class="mns" x="64" y="580">rect = { x: sx − tw/2 − 3, y: sy − 2, w: tw + 6, h: 16 }</text>
<text class="mns" x="64" y="598">sx = n.x × k + view.x   ·   sy = n.y × k + view.y + n.r × k + 4</text>
<text class="ps" x="64" y="622">The label sits below the node by its own radius plus four, so it never covers the shape it names.</text>

<rect class="card" x="664" y="104" width="584" height="560" rx="8"/>
<text class="h" x="684" y="132">Candidates in priority order</text>
<text class="mns" x="684" y="154">prio = (focus ? 4000) + (selected ? 3000) + (hovered ? 2000)</text>
<text class="mns" x="684" y="170">     + (pinned ? 900) + n.r × 18 + n.shownDeg</text>

<text class="lab" x="684" y="200">NODE</text>
<text class="lab" x="880" y="200">STATE</text>
<text class="lab" x="1010" y="200">r×18</text>
<text class="lab" x="1072" y="200">deg</text>
<text class="lab" x="1120" y="200">PRIO</text>
<text class="lab" x="1190" y="200">RESULT</text>
<path class="rowline" d="M684 208 L1228 208"/>

