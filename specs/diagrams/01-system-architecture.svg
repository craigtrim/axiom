<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" width="1280" height="940" role="img" aria-labelledby="fig1-title fig1-desc">
<title id="fig1-title">Figure 1 — Axiom module architecture</title>
<desc id="fig1-desc">Four layered bands — Data, Graph, Surfaces and Chrome — each holding four module blocks, with dependency arrows running from a dependant module to the module it depends on. The Data band holds the Store, the TBox builder, the ABox generator, the adjacency index and the resolver. The Graph band holds the viewport, the layout engines, the renderer and export. The Surfaces band holds the class tree, the inspector, the individuals table and the SPARQL console. The Chrome band holds the selection bus, notifications, input wiring and the boot loop.</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A5A5A"/></marker>
  <marker id="ara" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F6CBD"/></marker>
</defs>
