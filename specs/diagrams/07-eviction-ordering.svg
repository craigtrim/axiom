<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" width="1280" height="1000" role="img" aria-labelledby="fig7-title fig7-desc">
<title id="fig7-title">Figure 7 — Eviction ordering, worked</title>
<desc id="fig7-desc">A viewport holding twelve nodes at a budget of twelve. Each node is annotated with its graph distance from the focus set, its in-view degree and its touch clock. The focused node and the pinned node are excluded from the candidate list. The remaining ten candidates are listed in eviction order, and the three that leave to make room for three new toppings are marked. A second panel shows the same candidates ordered by the least-recently-touched policy, which picks a different second victim.</desc>
