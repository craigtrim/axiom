<text class="h" x="636" y="128">Candidates, in the order they would leave</text>
<text class="mns" x="636" y="150">cands.sort((a, b) =&gt; (b.dist − a.dist) || (a.shownDeg − b.shownDeg) || (a.touched − b.touched))</text>
<text class="ps" x="636" y="170">Furthest from the focus first; among equals the least connected in view; among those, the stalest.</text>

<rect class="inner" x="636" y="184" width="592" height="40" rx="4"/>
<text class="mn" x="650" y="200">if (n.pinned || G.focus.has(n.iri)) continue;</text>
<text class="mns" x="650" y="216">Pizza (focused) and Pizza Base (pinned) never enter the list — 12 nodes, 10 candidates.</text>

