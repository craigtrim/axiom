<rect class="inner" x="636" y="612" width="592" height="52" rx="4"/>
<text class="p" x="650" y="632">need = 3, so evictionOrder() is consumed from the top: three nodes are unlinked and deleted,</text>
<text class="p" x="650" y="650">their labels collected — evictedNames holds at most three — and the three new toppings are admitted.</text>

<rect class="card" x="32" y="700" width="590" height="216" rx="8"/>
<text class="h" x="52" y="728">Why pinned and focused nodes never leave</text>
<text class="p" x="52" y="752">The focus set is the answer to “what is this view about?”. Evicting a focus node</text>
<text class="p" x="52" y="770">would remove the reason the other nodes are on screen, so the guard excludes it</text>
<text class="p" x="52" y="788">before any sort key is evaluated — not by giving it a low score it might still lose.</text>
<text class="p" x="52" y="812">Pinning is the user's explicit override of the policy. A pin that could be overruled</text>
<text class="p" x="52" y="830">by pressure is not a pin.</text>
<text class="p" x="52" y="854">If the guard leaves too few candidates to free the space needed, addToView() does</text>
<text class="p" x="52" y="872">not break the guard. The shortfall becomes refused and the toast says so:</text>
<text class="mns" x="52" y="896">“…were left out — raise the budget or unpin something.”</text>

<rect class="card" x="642" y="700" width="606" height="216" rx="8"/>
<text class="h" x="662" y="728">The same ten under evictMode = lru</text>
<text class="mns" x="662" y="750">cands.sort((a, b) =&gt; a.touched − b.touched)</text>
<text class="p" x="662" y="774">priceGBP (3) · AX-100042 (4) · Tomato Topping (5) · Mozzarella (6) ·</text>
<text class="p" x="662" y="792">Cheese Topping (7) · Mushroom Pizza (8) · Margherita (10) ·</text>
<text class="p" x="662" y="810">Pizza Topping (11) · Named Pizza (12) · has Topping (13)</text>
<text class="p" x="662" y="838">The first victim is the same. The second differs: AX-100042 is the stalest node</text>
<text class="p" x="662" y="856">by clock, but under the default policy its second in-view edge saves it and</text>
<text class="p" x="662" y="874">Tomato Topping goes instead.</text>
<text class="ps" x="662" y="898">Distance is ignored entirely under lru, so a node next to the focus can be paged out.</text>

<text class="cap" x="32" y="952">Figure 7 · Eviction ordering, worked. Illustrates 20-graph-viewport-and-budget.md, “Eviction policy” and “Pins and focus”. [src: evictionOrder(), addToView()]</text>
<text class="cap" x="32" y="972">Every number in the table is an annotation on the node beside it; the ordering is the literal result of the three-term comparator, evaluated left to right.</text>
</svg>
