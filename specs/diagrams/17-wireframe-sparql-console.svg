<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="1280" height="960" role="img" aria-labelledby="fig17-title fig17-desc">
<title id="fig17-title">Figure 17 — SPARQL console</title>
<desc id="fig17-desc">The query Surface in the bottom dock: a command row with run and send-to-graph actions, a syntax-highlighted editor over a transparent textarea, a status line reporting rows, timing and store size, a virtualised result grid, and a right-hand rail of example queries. Annotations give the token colours, the evaluation pipeline and the error contract.</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A5A5A"/></marker>
  <marker id="ara" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F6CBD"/></marker>
</defs>
<style>
