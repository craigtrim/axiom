<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" width="1280" height="940" role="img" aria-labelledby="fig16-title fig16-desc">
<title id="fig16-title">Figure 16 — Individuals table</title>
<desc id="fig16-desc">The individuals Surface in the bottom dock: a filter bar carrying the type facet, the branch facet, a free-text field, a reset control, a row-count chip and the send-page-to-graph action; a sortable header of eight columns; a virtualised body of 32-pixel rows with one cell in edit; and an annotation layer showing the scroll spacer, the rendered window and the overscan bands.</desc>
