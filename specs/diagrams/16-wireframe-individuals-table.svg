<text class="cap" x="504" y="778">to see all 12,000 individuals.</text>
<rect class="btn" x="504" y="786" width="104" height="24" rx="4"/>
<text class="cell" x="518" y="803">Reset filters</text>

<!-- ─────────── annotation column ─────────── -->
<text class="kind" x="952" y="122">VIRTUALISATION</text>

<rect class="ann" x="948" y="136" width="300" height="132" rx="8"/>
<text class="mn" x="962" y="158">first = max(0,</text>
<text class="mn" x="962" y="174">  floor(scrollTop / 32) − 6)</text>
<text class="mn" x="962" y="196">count = ceil(clientHeight / 32)</text>
<text class="mn" x="962" y="212">  + 12</text>
<text class="mn" x="962" y="234">slice = rows[first, first+count]</text>
<text class="mns" x="962" y="256">translateY(first × 32)</text>

<rect class="anng" x="948" y="288" width="300" height="112" rx="8"/>
<text class="ct" x="962" y="310">Spacer</text>
<text class="cap" x="962" y="330">height = rows.length × 32 px.</text>
<text class="cap" x="962" y="346">It is the only element that knows</text>
<text class="cap" x="962" y="362">the true extent, so the scrollbar</text>
<text class="cap" x="962" y="378">is honest at 100,000 rows.</text>
<text class="cap" x="962" y="394">Cost is independent of row count.</text>

<rect class="anng" x="948" y="420" width="300" height="150" rx="8"/>
<text class="ct" x="962" y="442">Editing contract</text>
<text class="cap" x="962" y="462">One active editor at a time.</text>
<text class="cap" x="962" y="478">Validate on blur, never on keystroke.</text>
<text class="cap" x="962" y="494">Enter commits · Escape restores.</text>
<text class="cap" x="962" y="510">Editable: branch, price, rating.</text>
<text class="cap" x="962" y="526">Every rejection names the cause</text>
<text class="cap" x="962" y="542">and the remedy — never "invalid".</text>
<text class="cap" x="962" y="558">Each commit pushes an undo record.</text>

<rect class="anng" x="948" y="590" width="300" height="122" rx="8"/>
<text class="ct" x="962" y="612">Column widths</text>
<text class="mns" x="962" y="632">Individual  minmax(170px, 1.1fr)</text>
<text class="mns" x="962" y="648">Type        minmax(130px, 0.9fr)</text>
<text class="mns" x="962" y="664">Order ref   108px · Branch 124px</text>
<text class="mns" x="962" y="680">Price 92px · Rating 84px</text>
<text class="mns" x="962" y="696">Prepared 148px · Customer 0.9fr</text>

<rect class="ann" x="948" y="732" width="300" height="76" rx="8"/>
<text class="ct" x="962" y="754">Defect — focus loss</text>
<text class="cap" x="962" y="774">Commit re-renders the whole window,</text>
<text class="cap" x="962" y="790">dropping keyboard focus to the root.</text>

<line class="ann" x1="592" y1="295" x2="944" y2="200" marker-end="url(#ara)"/>
<line class="anng" x1="906" y1="250" x2="944" y2="330" marker-end="url(#ar)"/>

<text class="cap" x="32" y="862">Figure 16 · Individuals table. Illustrates 31-individuals-table.md, “Column model”, “Virtualisation”, “Inline editing” and “Empty state”. [src: COLS, ROW_H, renderTableRows(), beginCellEdit(), commitCell(), applyFilters()]</text>
<text class="cap" x="32" y="882">Sample values follow the fixture's generation rules: IRIs are zero-padded to six digits, order references run AX-100000 upward, and prices are the base price jittered by ±£1.</text>
<text class="cap" x="32" y="902">Sorting by any column other than Individual-ascending materialises a comparator pass; the default order is the generation order and is returned without sorting.</text>
</svg>
