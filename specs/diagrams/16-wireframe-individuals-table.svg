<text class="fig" x="32" y="30">FIGURE 16</text>
<text class="title" x="32" y="58">Individuals table — filter bar, sortable header, virtualised body</text>
<text class="sub" x="32" y="80">Row height is a constant 32 px, so the rendered window is arithmetic rather than measurement. Only the visible slice plus overscan exists in the document.</text>

