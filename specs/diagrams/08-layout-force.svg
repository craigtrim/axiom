<text class="fig" x="32" y="30">FIGURE 8</text>
<text class="title" x="32" y="58">Force layout — the Barnes–Hut quadtree and its opening angle</text>
<text class="sub" x="32" y="80">One repulsion pass for the target node n. A cell far enough away is collapsed to a single centre of mass; a cell too close is opened and its children tested in turn.</text>

