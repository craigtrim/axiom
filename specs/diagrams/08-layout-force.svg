<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" width="1280" height="940" role="img" aria-labelledby="fig8-title fig8-desc">
<title id="fig8-title">Figure 8 — Barnes–Hut quadtree and the opening-angle criterion</title>
<desc id="fig8-desc">A square root cell over a field of bodies, subdivided into quadrants. Three distant quadrants each satisfy the opening-angle test and are replaced by a single centre of mass, drawn as a cross with one dashed force arrow to the target node. The quadrant containing the target fails the test and is descended into; three of its four children then pass and are approximated, and the fourth, which holds the target, is evaluated body by body with solid arrows. Panels on the right give the criterion, the worked numbers for one approximated cell and one descended cell, and the depth and distance guards.</desc>
