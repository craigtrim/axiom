<text class="cf" x="66" y="508">SW quadrant fails the test → opened</text>
<text class="cf" x="66" y="682">SW·SW holds n → opened to its bodies</text>

<circle cx="100" cy="800" r="9" fill="#0F6CBD"/>
<circle cx="100" cy="800" r="14" fill="none" stroke="#1B1B1B" stroke-width="1.8"/>
<text class="p" x="70" y="832">n — the node being repelled</text>

<text class="lab" x="60" y="858">DASHED ARROW = ONE APPROXIMATED CELL · SOLID ARROW = ONE BODY-TO-BODY TERM · SIX CELL TERMS AND THREE BODY TERMS REPLACE TWENTY-NINE</text>

<rect class="card" x="816" y="100" width="432" height="186" rx="8"/>
<text class="h" x="836" y="128">The criterion</text>
<text class="mn" x="836" y="152">const THETA2 = 0.66;   /* theta = 0.81 */</text>
<text class="mn" x="836" y="172">const w = q.x1 − q.x0;</text>
<text class="mn" x="836" y="192">if (!q.k || w * w &lt; THETA2 * d2) { … }</text>
<text class="ps" x="836" y="216">d2 is the squared distance from n to the cell's centre of</text>
<text class="ps" x="836" y="234">mass. Comparing squares keeps the hot path free of a square</text>
<text class="ps" x="836" y="252">root, which is why the constant is θ² and not θ.</text>
<text class="ps" x="836" y="274">A leaf — no children — is always taken as-is.</text>

<rect class="card" x="816" y="302" width="432" height="190" rx="8"/>
<text class="h" x="836" y="330">Worked: the NE cell is approximated</text>
<text class="mns" x="836" y="352">cell width w = 350 · centre of mass at (600, 280)</text>
<text class="mns" x="836" y="370">n at (100, 800) → dx = 500, dy = −520</text>
<text class="mn" x="836" y="392">d2 = 500² + 520² = 520,400</text>
<text class="mn" x="836" y="412">w²  = 122,500</text>
<text class="mn" x="836" y="432">θ²·d2 = 0.66 × 520,400 = 343,464</text>
<text class="p" x="836" y="456">122,500 &lt; 343,464 → approximate. Six bodies collapse into</text>
<text class="p" x="836" y="474">one term: n.vx += dx × (q.mass × alpha / d2).</text>

<rect class="card" x="816" y="508" width="432" height="186" rx="8"/>
<text class="h" x="836" y="536">Worked: the SW cell is opened</text>
<text class="mns" x="836" y="558">same width w = 350 · centre of mass at (245, 655)</text>
<text class="mn" x="836" y="580">d2 = 145² + 145² = 42,050</text>
<text class="mn" x="836" y="600">θ²·d2 = 27,753   …and w² = 122,500</text>
<text class="p" x="836" y="624">122,500 &gt; 27,753 → the cell subtends too wide an angle, so</text>
<text class="p" x="836" y="642">its mass cannot stand in for its parts. qRepel() recurses into</text>
<text class="p" x="836" y="660">all four children and tests each on its own terms.</text>
<text class="ps" x="836" y="682">Three of the four then pass; only the cell holding n opens again.</text>

<rect class="card" x="816" y="710" width="432" height="154" rx="8"/>
<text class="h" x="836" y="738">Guards and cost</text>
<text class="mns" x="836" y="760">depth &gt; 22 || (q.x1 − q.x0) &lt; 0.5 → q.extra bucket</text>
<text class="ps" x="836" y="778">Coincident bodies would subdivide forever, so past the guard they</text>
<text class="ps" x="836" y="796">share a leaf and are always compared pairwise.</text>
<text class="mns" x="836" y="818">if (d2 &lt; 9) d2 = 9;   charge = 210 + r × 16</text>
<text class="ps" x="836" y="836">The clamp stops two touching nodes producing an infinite force.</text>
<text class="ps" x="836" y="854">Net cost: O(n log n) per tick instead of O(n²).</text>

<text class="cap" x="32" y="898">Figure 8 · Barnes–Hut repulsion. Illustrates 21-layout-algorithms.md, “Force-directed: repulsion”. [src: QNode(), qInsert(), qAccumulate(), qRepel(), forceTick()]</text>
<text class="cap" x="32" y="918">Attraction is separate: every edge is a Hooke spring with target 48 + ra + rb, plus 26 more for a non-structural predicate, stiffness scaled by the lesser endpoint degree.</text>
</svg>
